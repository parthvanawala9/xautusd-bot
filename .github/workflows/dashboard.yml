name: Deploy Dashboard API

on:
  push:
    branches:
      - main
    paths:
      - "dashboard_api.py"
      - "requirements.txt"
      - ".github/workflows/dashboard.yml"
  workflow_dispatch:

jobs:
  deploy-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare SSH
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -e

          mkdir -p "$HOME/.ssh"

          printf '%s\n' "$ORACLE_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/oci_key"

          chmod 600 "$HOME/.ssh/oci_key"

          echo "Checking SSH private key format..."

          ssh-keygen -y -f "$HOME/.ssh/oci_key" > /dev/null

          echo "SSH key is valid."

      - name: Copy dashboard API
        run: |
          set -e

          scp \
            -i "$HOME/.ssh/oci_key" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=30 \
            -o ConnectionAttempts=3 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            dashboard_api.py \
            opc@80.225.246.202:/home/opc/dashboard_api.py

      - name: Copy requirements
        run: |
          set -e

          scp \
            -i "$HOME/.ssh/oci_key" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=30 \
            -o ConnectionAttempts=3 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            requirements.txt \
            opc@80.225.246.202:/home/opc/requirements.txt

      - name: Start dashboard API
        run: |
          set -e

          ssh \
            -i "$HOME/.ssh/oci_key" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=30 \
            -o ConnectionAttempts=3 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            opc@80.225.246.202 << 'EOF'

          set -e

          cd /home/opc

          echo "Installing dashboard dependencies..."

          python3 -m pip install -r requirements.txt

          echo "Stopping old dashboard API..."

          pkill -f "dashboard_api.py" || true

          sleep 2

          echo "Starting dashboard API..."

          nohup python3 dashboard_api.py > dashboard_api.log 2>&1 &

          sleep 5

          echo "Checking dashboard API..."

          curl -f http://127.0.0.1:8000/api/dashboard

          echo "Dashboard API deployed successfully."

          EOF
