name: Deploy Dashboard API

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy-dashboard:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ============================================================
      # PREPARE SSH
      # ============================================================

      - name: Prepare SSH
        env:
          ORACLE_PRIVATE_KEY: ${{ secrets.ORACLE_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh

          printf '%s\n' "$ORACLE_PRIVATE_KEY" \
            > ~/.ssh/oracle.key

          chmod 600 ~/.ssh/oracle.key


      # ============================================================
      # COPY DASHBOARD API
      # ============================================================

      - name: Copy dashboard API
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
        run: |

          ssh \
            -i ~/.ssh/oracle.key \
            -o StrictHostKeyChecking=no \
            "$ORACLE_USER@$ORACLE_HOST" \
            "mkdir -p /home/opc/xautusd-bot/dashboard"

          scp \
            -i ~/.ssh/oracle.key \
            -o StrictHostKeyChecking=no \
            dashboard_api.py \
            "$ORACLE_USER@$ORACLE_HOST:/home/opc/xautusd-bot/dashboard/dashboard_api.py"


      # ============================================================
      # INSTALL DASHBOARD DEPENDENCIES
      # AND RESTART ONLY DASHBOARD API
      # ============================================================

      - name: Install dashboard dependencies and start API
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
        run: |

          ssh \
            -i ~/.ssh/oracle.key \
            -o StrictHostKeyChecking=no \
            "$ORACLE_USER@$ORACLE_HOST" << 'EOF'

          set -e

          cd /home/opc/xautusd-bot

          echo "=========================================="
          echo "INSTALLING DASHBOARD DEPENDENCIES"
          echo "=========================================="

          python3 -m pip install --user flask flask-cors requests python-dotenv


          echo "=========================================="
          echo "RESTARTING ONLY DASHBOARD API"
          echo "=========================================="

          pkill -f "/home/opc/xautusd-bot/dashboard/dashboard_api.py" || true

          sleep 2

          nohup python3 \
            /home/opc/xautusd-bot/dashboard/dashboard_api.py \
            > /home/opc/xautusd-bot/dashboard/dashboard.log 2>&1 &

          sleep 5


          echo "=========================================="
          echo "DASHBOARD PROCESS"
          echo "=========================================="

          pgrep -af \
            "/home/opc/xautusd-bot/dashboard/dashboard_api.py" \
            || true


          echo "=========================================="
          echo "PORT 8000"
          echo "=========================================="

          ss -lntp | grep ':8000' || true


          echo "=========================================="
          echo "LOCAL HEALTH CHECK"
          echo "=========================================="

          curl -fsS \
            http://127.0.0.1:8000/api/health

          echo
          echo "Dashboard API is working."

          EOF


      # ============================================================
      # INSTALL CLOUDFLARE QUICK TUNNEL AS SYSTEMD SERVICE
      # ============================================================

      - name: Install persistent Cloudflare Quick Tunnel
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
        run: |

          ssh \
            -i ~/.ssh/oracle.key \
            -o StrictHostKeyChecking=no \
            "$ORACLE_USER@$ORACLE_HOST" << 'EOF'

          set -e

          echo "=========================================="
          echo "CLOUDFLARE CHECK"
          echo "=========================================="

          if ! command -v cloudflared >/dev/null 2>&1; then
            echo "ERROR: cloudflared is not installed."
            exit 1
          fi

          cloudflared version


          echo "=========================================="
          echo "CREATING DASHBOARD TUNNEL SERVICE"
          echo "=========================================="

          sudo tee /etc/systemd/system/xautusd-dashboard.service > /dev/null << 'SERVICE'

          [Unit]
          Description=XAUTUSD Dashboard Cloudflare Quick Tunnel
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          User=opc
          WorkingDirectory=/home/opc/xautusd-bot

          ExecStart=/usr/bin/cloudflared tunnel --url http://127.0.0.1:8000

          Restart=always
          RestartSec=5

          StandardOutput=append:/home/opc/xautusd-bot/dashboard/cloudflare.log
          StandardError=append:/home/opc/xautusd-bot/dashboard/cloudflare.log

          [Install]
          WantedBy=multi-user.target

          SERVICE


          echo "=========================================="
          echo "RELOADING SYSTEMD"
          echo "=========================================="

          sudo systemctl daemon-reload

          sudo systemctl enable xautusd-dashboard.service


          echo "=========================================="
          echo "STOPPING OLD QUICK TUNNEL"
          echo "=========================================="

          if [ -f /home/opc/xautusd-bot/dashboard/quick-tunnel.pid ]; then

            OLD_PID=$(cat \
              /home/opc/xautusd-bot/dashboard/quick-tunnel.pid \
              2>/dev/null || true)

            if [ -n "$OLD_PID" ]; then
              kill "$OLD_PID" 2>/dev/null || true
            fi

            rm -f \
              /home/opc/xautusd-bot/dashboard/quick-tunnel.pid

          fi


          echo "=========================================="
          echo "STARTING PERSISTENT TUNNEL"
          echo "=========================================="

          sudo systemctl restart xautusd-dashboard.service

          sleep 8


          echo "=========================================="
          echo "CLOUDFLARE SERVICE STATUS"
          echo "=========================================="

          sudo systemctl --no-pager status \
            xautusd-dashboard.service \
            || true


          echo "=========================================="
          echo "CLOUDFLARE TUNNEL URL"
          echo "=========================================="

          URL=""

          for i in $(seq 1 30); do

            sleep 2

            URL=$(grep -oE \
              'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' \
              /home/opc/xautusd-bot/dashboard/cloudflare.log \
              | tail -n 1 \
              || true)

            if [ -n "$URL" ]; then
              break
            fi

          done


          if [ -z "$URL" ]; then

            echo "ERROR: Cloudflare URL was not found."

            echo "===== CLOUDFLARE LOG ====="

            tail -n 100 \
              /home/opc/xautusd-bot/dashboard/cloudflare.log \
              || true

            exit 1

          fi


          echo
          echo "=========================================="
          echo "CLOUDFLARE DASHBOARD URL"
          echo "$URL"
          echo "=========================================="

          echo
          echo "HEALTH URL"
          echo "$URL/api/health"

          echo
          echo "DASHBOARD API URL"
          echo "$URL/api/dashboard"


          echo
          echo "=========================================="
          echo "TESTING CLOUDFLARE TUNNEL"
          echo "=========================================="

          sleep 3

          curl -fsS \
            "$URL/api/health"

          echo

          EOF


      # ============================================================
      # FINAL VERIFICATION
      # ============================================================

      - name: Verify dashboard and bot
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
        run: |

          ssh \
            -i ~/.ssh/oracle.key \
            -o StrictHostKeyChecking=no \
            "$ORACLE_USER@$ORACLE_HOST" << 'EOF'

          echo
          echo "=========================================="
          echo "FINAL VERIFICATION"
          echo "=========================================="

          echo
          echo "===== XAUTUSD BOT ====="

          pgrep -af \
            "/home/opc/xautusd-bot/bot.py" \
            || true


          echo
          echo "===== DASHBOARD API ====="

          pgrep -af \
            "/home/opc/xautusd-bot/dashboard/dashboard_api.py" \
            || true


          echo
          echo "===== PORT 8000 ====="

          ss -lntp | grep ':8000' || true


          echo
          echo "===== CLOUDFLARE SERVICE ====="

          sudo systemctl is-active \
            xautusd-dashboard.service \
            || true


          echo
          echo "===== CLOUDFLARE PROCESS ====="

          pgrep -af \
            "cloudflared tunnel --url http://127.0.0.1:8000" \
            || true


          echo
          echo "===== LOCAL DASHBOARD HEALTH ====="

          curl -fsS \
            http://127.0.0.1:8000/api/health

          echo

          echo
          echo "=========================================="
          echo "DEPLOYMENT COMPLETE"
          echo "=========================================="

          EOF
