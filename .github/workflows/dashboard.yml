name: Update Dashboard Data

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests python-dotenv flask flask-cors

      - name: Ensure Dummy State File Exists
        run: |
          if [ ! -f xautusd_state.json ]; then
            echo '{}' > xautusd_state.json
          fi

      - name: Generate Dashboard JSON
        env:
          DELTA_API_KEY: ${{ secrets.DELTA_API_KEY }}
          DELTA_API_SECRET: ${{ secrets.DELTA_API_SECRET }}
          DELTA_SYMBOL: 'XAUTUSD'
          DELTA_BASE_URL: 'https://api.india.delta.exchange'
        run: |
          python3 -c "import json; from dashboard_api import build_dashboard; print(json.dumps(build_dashboard()))" > dashboard.json

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
