name: Deploy Dashboard API

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy-dashboard:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare SSH
        env:
          ORACLE_PRIVATE_KEY: ${{ secrets.ORACLE_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$ORACLE_PRIVATE_KEY" > ~/.ssh/oracle.key
          chmod 600 ~/.ssh/oracle.key

      - name: Copy dashboard API
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
        run: |
          ssh \
            -i ~/.ssh/oracle.key \
            -o StrictHostKeyChecking=no \
            "$ORACLE_USER@$ORACLE_HOST" \
            "mkdir -p /home/opc/xautusd-bot/dashboard"

          scp \
            -i ~/.ssh/oracle.key \
            -o StrictHostKeyChecking=no \
            dashboard_api.py \
            "$ORACLE_USER@$ORACLE_HOST:/home/opc/xautusd-bot/dashboard/dashboard_api.py"

      - name: Restart Dashboard API
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
        run: |
          ssh \
            -i ~/.ssh/oracle.key \
            -o StrictHostKeyChecking=no \
            "$ORACLE_USER@$ORACLE_HOST" << 'EOF'

          set -e

          DASHBOARD="/home/opc/xautusd-bot/dashboard/dashboard_api.py"

          echo "===== STOP OLD DASHBOARD API ====="

          PIDS=$(ps -eo pid=,args= | \
            awk '$0 ~ /\/home\/opc\/xautusd-bot\/dashboard\/dashboard_api\.py/ && $0 !~ /awk/ {print $1}')

          if [ -n "$PIDS" ]; then
            echo "$PIDS" | xargs -r kill
            sleep 3
          fi

          echo
          echo "===== VERIFY OLD PROCESS STOPPED ====="

          ps -eo pid=,args= | \
            awk '$0 ~ /\/home\/opc\/xautusd-bot\/dashboard\/dashboard_api\.py/ && $0 !~ /awk/ {print}' \
            || true

          echo
          echo "===== START NEW DASHBOARD API ====="

          nohup python3 -u "$DASHBOARD" \
            > /home/opc/xautusd-bot/dashboard/dashboard.log 2>&1 &

          NEW_PID=$!

          echo "Dashboard PID: $NEW_PID"

          sleep 5

          echo
          echo "===== DASHBOARD PROCESS ====="

          ps -p "$NEW_PID" -f || true

          echo
          echo "===== PORT 8000 ====="

          ss -lntp | grep ':8000' || true

          echo
          echo "===== LOCAL HEALTH ====="

          curl -fsS \
            http://127.0.0.1:8000/api/health

          echo
          echo
          echo "===== LOCAL DEBUG ====="

          curl -fsS \
            http://127.0.0.1:8000/api/debug

          echo
          echo
          echo "===== LOCAL DASHBOARD ====="

          curl -fsS \
            http://127.0.0.1:8000/api/dashboard

          echo

          EOF

      - name: Start Cloudflare Quick Tunnel
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
        run: |
          ssh \
            -i ~/.ssh/oracle.key \
            -o StrictHostKeyChecking=no \
            "$ORACLE_USER@$ORACLE_HOST" << 'EOF'

          set -e

          DASHBOARD_DIR="/home/opc/xautusd-bot/dashboard"
          PID_FILE="$DASHBOARD_DIR/quick-tunnel.pid"
          LOG_FILE="$DASHBOARD_DIR/quick-tunnel.log"

          mkdir -p "$DASHBOARD_DIR"

          echo "===== CLOUDFLARE ====="

          CLOUDFLARED=$(command -v cloudflared || true)

          if [ -z "$CLOUDFLARED" ]; then
            echo "ERROR: cloudflared is not installed."
            exit 1
          fi

          "$CLOUDFLARED" version

          echo
          echo "===== STOP OLD QUICK TUNNEL ====="

          if [ -f "$PID_FILE" ]; then

            OLD_PID=$(cat "$PID_FILE" 2>/dev/null || true)

            if [ -n "$OLD_PID" ] && kill -0 "$OLD_PID" 2>/dev/null; then
              kill "$OLD_PID" 2>/dev/null || true
              sleep 3
            fi

            rm -f "$PID_FILE"

          fi

          : > "$LOG_FILE"

          echo
          echo "===== START QUICK TUNNEL ====="

          nohup "$CLOUDFLARED" tunnel \
            --url http://127.0.0.1:8000 \
            > "$LOG_FILE" 2>&1 &

          TUNNEL_PID=$!

          echo "$TUNNEL_PID" > "$PID_FILE"

          echo "Quick Tunnel PID: $TUNNEL_PID"

          URL=""

          for i in $(seq 1 40); do

            sleep 2

            URL=$(grep -oE \
              'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' \
              "$LOG_FILE" \
              | tail -n 1 || true)

            if [ -n "$URL" ]; then
              break
            fi

          done

          if [ -z "$URL" ]; then
            echo "ERROR: Cloudflare URL not found."
            cat "$LOG_FILE" || true
            exit 1
          fi

          echo
          echo "=========================================="
          echo "CLOUDFLARE DASHBOARD URL:"
          echo "$URL"
          echo "=========================================="

          echo
          echo "HEALTH:"
          echo "$URL/api/health"

          echo
          echo "DASHBOARD:"
          echo "$URL/api/dashboard"

          echo
          echo "DEBUG:"
          echo "$URL/api/debug"

          echo
          echo "===== CLOUDFLARE HEALTH TEST ====="

          curl -fsS "$URL/api/health"

          echo
          echo
          echo "===== CLOUDFLARE DEBUG TEST ====="

          curl -fsS "$URL/api/debug"

          echo
          echo
          echo "===== CLOUDFLARE DASHBOARD TEST ====="

          curl -fsS "$URL/api/dashboard"

          echo

          EOF

      - name: Verify Dashboard and Bot
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
        run: |
          ssh \
            -i ~/.ssh/oracle.key \
            -o StrictHostKeyChecking=no \
            "$ORACLE_USER@$ORACLE_HOST" << 'EOF'

          echo "===== BOT CHECK ====="

          pgrep -af \
            "/home/opc/xautusd-bot/bot.py" \
            || true

          echo
          echo "===== DASHBOARD CHECK ====="

          pgrep -af \
            "/home/opc/xautusd-bot/dashboard/dashboard_api.py" \
            || true

          echo
          echo "===== PORT 8000 ====="

          ss -lntp | grep ':8000' || true

          echo
          echo "===== HEALTH ====="

          curl -fsS \
            http://127.0.0.1:8000/api/health

          echo
          echo
          echo "===== DEBUG ====="

          curl -fsS \
            http://127.0.0.1:8000/api/debug

          echo

          EOF
