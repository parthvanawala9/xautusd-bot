name: Deploy Dashboard API

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy-dashboard:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare SSH
        env:
          ORACLE_PRIVATE_KEY: ${{ secrets.ORACLE_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$ORACLE_PRIVATE_KEY" > ~/.ssh/oracle.key
          chmod 600 ~/.ssh/oracle.key

      - name: Copy dashboard API
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
        run: |
          ssh \
            -i ~/.ssh/oracle.key \
            -o StrictHostKeyChecking=no \
            "$ORACLE_USER@$ORACLE_HOST" \
            "mkdir -p /home/opc/xautusd-bot/dashboard"

          scp \
            -i ~/.ssh/oracle.key \
            -o StrictHostKeyChecking=no \
            dashboard_api.py \
            "$ORACLE_USER@$ORACLE_HOST:/home/opc/xautusd-bot/dashboard/dashboard_api.py"

      - name: Install dashboard dependencies and restart API
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
        run: |
          ssh \
            -i ~/.ssh/oracle.key \
            -o StrictHostKeyChecking=no \
            "$ORACLE_USER@$ORACLE_HOST" << 'EOF'

          cd /home/opc/xautusd-bot

          echo "===== INSTALL DEPENDENCIES ====="

          python3 -m pip install --user \
            flask \
            flask-cors \
            requests \
            python-dotenv

          echo
          echo "===== STOP OLD DASHBOARD API ====="

          PIDS=$(pgrep -f "/home/opc/xautusd-bot/dashboard/dashboard_api.py" || true)

          if [ -n "$PIDS" ]; then
            echo "Old dashboard PID(s):"
            echo "$PIDS"

            for PID in $PIDS; do
              kill "$PID" 2>/dev/null || true
            done

            sleep 3
          fi

          echo
          echo "===== FORCE STOP REMAINING DASHBOARD API ====="

          PIDS=$(pgrep -f "/home/opc/xautusd-bot/dashboard/dashboard_api.py" || true)

          if [ -n "$PIDS" ]; then
            for PID in $PIDS; do
              kill -9 "$PID" 2>/dev/null || true
            done

            sleep 2
          fi

          echo
          echo "===== VERIFY PORT 8000 ====="

          ss -lntp | grep ':8000' || true

          echo
          echo "===== START NEW DASHBOARD API ====="

          nohup python3 \
            /home/opc/xautusd-bot/dashboard/dashboard_api.py \
            > /home/opc/xautusd-bot/dashboard/dashboard.log 2>&1 &

          DASHBOARD_PID=$!

          echo "Dashboard PID: $DASHBOARD_PID"

          sleep 5

          echo
          echo "===== DASHBOARD PROCESS ====="

          pgrep -af \
            "/home/opc/xautusd-bot/dashboard/dashboard_api.py" \
            || true

          echo
          echo "===== PORT 8000 ====="

          ss -lntp | grep ':8000' || true

          echo
          echo "===== LOCAL HEALTH ====="

          curl -fsS \
            http://127.0.0.1:8000/api/health

          echo

          echo
          echo "===== LOCAL DEBUG ====="

          curl -fsS \
            http://127.0.0.1:8000/api/debug

          echo

          echo
          echo "===== LOCAL DASHBOARD ====="

          curl -fsS \
            http://127.0.0.1:8000/api/dashboard

          echo

          EOF

      - name: Start Cloudflare Quick Tunnel
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
        run: |
          ssh \
            -i ~/.ssh/oracle.key \
            -o StrictHostKeyChecking=no \
            "$ORACLE_USER@$ORACLE_HOST" << 'EOF'

          cd /home/opc/xautusd-bot

          echo "===== CLOUDFLARE ====="

          CLOUDFLARED=$(command -v cloudflared || true)

          if [ -z "$CLOUDFLARED" ]; then
            echo "ERROR: cloudflared is not installed."
            exit 1
          fi

          "$CLOUDFLARED" version

          mkdir -p /home/opc/xautusd-bot/dashboard

          touch \
            /home/opc/xautusd-bot/dashboard/quick-tunnel.log

          echo
          echo "===== STOP OLD QUICK TUNNEL ====="

          if [ -f /home/opc/xautusd-bot/dashboard/quick-tunnel.pid ]; then

            OLD_PID=$(cat \
              /home/opc/xautusd-bot/dashboard/quick-tunnel.pid \
              2>/dev/null || true)

            if [ -n "$OLD_PID" ]; then

              if kill -0 "$OLD_PID" 2>/dev/null; then
                kill "$OLD_PID" 2>/dev/null || true
                sleep 2
              fi

            fi

            rm -f \
              /home/opc/xautusd-bot/dashboard/quick-tunnel.pid
          fi

          : > \
            /home/opc/xautusd-bot/dashboard/quick-tunnel.log

          echo
          echo "===== START QUICK TUNNEL ====="

          nohup "$CLOUDFLARED" tunnel \
            --url http://127.0.0.1:8000 \
            > /home/opc/xautusd-bot/dashboard/quick-tunnel.log 2>&1 &

          TUNNEL_PID=$!

          echo "$TUNNEL_PID" \
            > /home/opc/xautusd-bot/dashboard/quick-tunnel.pid

          echo "Quick Tunnel PID: $TUNNEL_PID"

          echo
          echo "Waiting for Cloudflare URL..."

          URL=""

          for i in $(seq 1 40); do

            sleep 2

            URL=$(grep -oE \
              'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' \
              /home/opc/xautusd-bot/dashboard/quick-tunnel.log \
              | tail -n 1 || true)

            if [ -n "$URL" ]; then
              break
            fi

          done

          if [ -z "$URL" ]; then

            echo "ERROR: Cloudflare URL was not found."

            echo
            echo "===== CLOUDFLARE LOG ====="

            cat \
              /home/opc/xautusd-bot/dashboard/quick-tunnel.log \
              || true

            exit 1
          fi

          echo
          echo "=========================================="
          echo "CLOUDFLARE DASHBOARD URL:"
          echo "$URL"
          echo "=========================================="

          echo
          echo "HEALTH URL:"
          echo "$URL/api/health"

          echo
          echo "DEBUG URL:"
          echo "$URL/api/debug"

          echo
          echo "DASHBOARD API URL:"
          echo "$URL/api/dashboard"

          echo
          echo "===== HEALTH TEST ====="

          curl -fsS \
            "$URL/api/health"

          echo

          echo
          echo "===== DEBUG TEST ====="

          curl -fsS \
            "$URL/api/debug"

          echo

          echo
          echo "===== DASHBOARD DATA TEST ====="

          curl -fsS \
            "$URL/api/dashboard"

          echo

          EOF

      - name: Verify dashboard
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
        run: |
          ssh \
            -i ~/.ssh/oracle.key \
            -o StrictHostKeyChecking=no \
            "$ORACLE_USER@$ORACLE_HOST" << 'EOF'

          echo "===== DASHBOARD API CHECK ====="

          pgrep -af \
            "/home/opc/xautusd-bot/dashboard/dashboard_api.py" \
            || true

          echo
          echo "===== PORT 8000 ====="

          ss -lntp | grep ':8000' || true

          echo
          echo "===== LOCAL HEALTH ====="

          curl -fsS \
            http://127.0.0.1:8000/api/health

          echo

          echo
          echo "===== LOCAL DEBUG ====="

          curl -fsS \
            http://127.0.0.1:8000/api/debug

          echo

          echo
          echo "===== QUICK TUNNEL ====="

          if [ -f /home/opc/xautusd-bot/dashboard/quick-tunnel.pid ]; then

            PID=$(cat \
              /home/opc/xautusd-bot/dashboard/quick-tunnel.pid)

            ps -p "$PID" -f || true

          fi

          EOF
