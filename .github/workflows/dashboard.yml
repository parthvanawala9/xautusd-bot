name: Deploy Dashboard API

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare SSH
        env:
          ORACLE_PRIVATE_KEY: ${{ secrets.ORACLE_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$ORACLE_PRIVATE_KEY" > ~/.ssh/oracle.key
          chmod 600 ~/.ssh/oracle.key

      - name: Copy dashboard API
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
        run: |
          ssh \
            -i ~/.ssh/oracle.key \
            -o StrictHostKeyChecking=no \
            "$ORACLE_USER@$ORACLE_HOST" \
            "mkdir -p /home/opc/xautusd-bot/dashboard"

          scp \
            -i ~/.ssh/oracle.key \
            -o StrictHostKeyChecking=no \
            dashboard_api.py \
            "$ORACLE_USER@$ORACLE_HOST:/home/opc/xautusd-bot/dashboard/dashboard_api.py"

      - name: Install dashboard dependencies and start API
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
        run: |
          ssh \
            -i ~/.ssh/oracle.key \
            -o StrictHostKeyChecking=no \
            "$ORACLE_USER@$ORACLE_HOST" << 'EOF'

          cd /home/opc/xautusd-bot

          python3 -m pip install --user flask flask-cors

          # Restart ONLY the dashboard API.
          # DO NOT touch bot.py.
          pkill -f "/home/opc/xautusd-bot/dashboard/dashboard_api.py" || true

          nohup python3 /home/opc/xautusd-bot/dashboard/dashboard_api.py \
            > /home/opc/xautusd-bot/dashboard/dashboard.log 2>&1 &

          sleep 5

          echo "===== DASHBOARD PROCESS ====="
          pgrep -af "/home/opc/xautusd-bot/dashboard/dashboard_api.py" || true

          echo "===== PORT 8000 ====="
          ss -lntp | grep ':8000' || true

          echo "===== LOCAL HEALTH CHECK ====="
          curl -s http://127.0.0.1:8000/api/health

          echo

          EOF

      - name: Start Cloudflare Quick Tunnel
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
        run: |
          ssh \
            -i ~/.ssh/oracle.key \
            -o StrictHostKeyChecking=no \
            "$ORACLE_USER@$ORACLE_HOST" << 'EOF'

          cd /home/opc/xautusd-bot

          echo "===== CLOUDFLARE ====="

          if ! command -v cloudflared >/dev/null 2>&1; then
            echo "cloudflared is not installed."
            exit 1
          fi

          # Stop ONLY a previous Quick Tunnel for port 8000.
          # This does NOT stop the named xautusd-dashboard tunnel
          # and does NOT stop bot.py.
          if [ -f /home/opc/xautusd-bot/dashboard/quick-tunnel.pid ]; then
            PID=$(cat /home/opc/xautusd-bot/dashboard/quick-tunnel.pid 2>/dev/null || true)

            if [ -n "$PID" ] && kill -0 "$PID" 2>/dev/null; then
              kill "$PID" 2>/dev/null || true
              sleep 2
            fi

            rm -f /home/opc/xautusd-bot/dashboard/quick-tunnel.pid
          fi

          rm -f /home/opc/xautusd-bot/dashboard/quick-tunnel.log

          nohup cloudflared tunnel \
            --url http://127.0.0.1:8000 \
            > /home/opc/xautusd-bot/dashboard/quick-tunnel.log 2>&1 &

          TUNNEL_PID=$!

          echo "$TUNNEL_PID" \
            > /home/opc/xautusd-bot/dashboard/quick-tunnel.pid

          echo "Quick Tunnel PID: $TUNNEL_PID"

          echo "Waiting for Cloudflare URL..."

          for i in $(seq 1 30); do
            sleep 2

            URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' \
              /home/opc/xautusd-bot/dashboard/quick-tunnel.log \
              | head -n 1 || true)

            if [ -n "$URL" ]; then
              echo
              echo "=========================================="
              echo "CLOUDFLARE DASHBOARD URL:"
              echo "$URL"
              echo "=========================================="
              echo
              echo "HEALTH URL:"
              echo "$URL/api/health"
              echo

              exit 0
            fi
          done

          echo "Cloudflare Quick Tunnel did not produce a URL."
          echo "===== CLOUDFLARE LOG ====="
          cat /home/opc/xautusd-bot/dashboard/quick-tunnel.log

          exit 1

          EOF

      - name: Verify dashboard
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
        run: |
          ssh \
            -i ~/.ssh/oracle.key \
            -o StrictHostKeyChecking=no \
            "$ORACLE_USER@$ORACLE_HOST" \
            "echo '===== BOT CHECK ====='; \
             pgrep -af '/home/opc/xautusd-bot/bot.py' || true; \
             echo '===== DASHBOARD CHECK ====='; \
             pgrep -af '/home/opc/xautusd-bot/dashboard/dashboard_api.py' || true; \
             echo '===== CLOUDFLARE CHECK ====='; \
             pgrep -af 'cloudflared tunnel --url http://127.0.0.1:8000' || true"
