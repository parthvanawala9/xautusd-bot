name: Deploy Dashboard API

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare SSH
        env:
          ORACLE_PRIVATE_KEY: ${{ secrets.ORACLE_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$ORACLE_PRIVATE_KEY" > ~/.ssh/oracle.key
          chmod 600 ~/.ssh/oracle.key

      - name: Deploy Dashboard API and Restart Service
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
        run: |
          ssh -i ~/.ssh/oracle.key -o StrictHostKeyChecking=no "$ORACLE_USER@$ORACLE_HOST" "mkdir -p /home/opc/xautusd-bot/dashboard"
          scp -i ~/.ssh/oracle.key -o StrictHostKeyChecking=no dashboard_api.py "$ORACLE_USER@$ORACLE_HOST:/home/opc/xautusd-bot/dashboard/dashboard_api.py"

          ssh -i ~/.ssh/oracle.key -o StrictHostKeyChecking=no "$ORACLE_USER@$ORACLE_HOST" << 'EOF'
          set -e

          python3 -m pip install --user flask flask-cors requests python-dotenv > /dev/null 2>&1

          sudo bash -c 'cat <<SERVICE > /etc/systemd/system/dashboard-api.service
          [Unit]
          Description=XAUTUSD Dashboard API
          After=network.target

          [Service]
          Type=simple
          User=opc
          WorkingDirectory=/home/opc/xautusd-bot/dashboard
          ExecStart=/usr/bin/python3 /home/opc/xautusd-bot/dashboard/dashboard_api.py
          Restart=always
          RestartSec=5
          StandardOutput=append:/home/opc/xautusd-bot/dashboard/dashboard.log
          StandardError=append:/home/opc/xautusd-bot/dashboard/dashboard.log

          [Install]
          WantedBy=multi-user.target
          SERVICE'

          sudo systemctl daemon-reload
          sudo systemctl enable dashboard-api
          sudo systemctl restart dashboard-api

          sleep 3

          echo "===== LOCAL HEALTH CHECK ====="
          curl -fsS http://127.0.0.1:8000/api/health
          echo ""

          echo "===== DEBUG DATA ====="
          curl -sS http://127.0.0.1:8000/api/debug
          echo ""

          echo "===== DASHBOARD DATA ====="
          curl -sS http://127.0.0.1:8000/api/dashboard
          echo ""
          EOF
