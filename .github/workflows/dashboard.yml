name: Deploy Dashboard API

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy-dashboard:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare SSH
        env:
          ORACLE_PRIVATE_KEY: ${{ secrets.ORACLE_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$ORACLE_PRIVATE_KEY" > ~/.ssh/oracle.key
          chmod 600 ~/.ssh/oracle.key

      - name: Copy dashboard API
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
        run: |
          ssh \
            -i ~/.ssh/oracle.key \
            -o StrictHostKeyChecking=no \
            "$ORACLE_USER@$ORACLE_HOST" \
            "mkdir -p /home/opc/xautusd-bot/dashboard"

          scp \
            -i ~/.ssh/oracle.key \
            -o StrictHostKeyChecking=no \
            dashboard_api.py \
            "$ORACLE_USER@$ORACLE_HOST:/home/opc/xautusd-bot/dashboard/dashboard_api.py"

      - name: Install dashboard dependencies and restart API
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
        run: |
          ssh \
            -i ~/.ssh/oracle.key \
            -o StrictHostKeyChecking=no \
            "$ORACLE_USER@$ORACLE_HOST" << 'EOF'

          cd /home/opc/xautusd-bot

          python3 -m pip install --user flask flask-cors requests python-dotenv

          # ONLY restart dashboard API.
          # NEVER TOUCH bot.py.
          pkill -f "/home/opc/xautusd-bot/dashboard/dashboard_api.py" || true

          sleep 2

          nohup python3 \
            /home/opc/xautusd-bot/dashboard/dashboard_api.py \
            > /home/opc/xautusd-bot/dashboard/dashboard.log 2>&1 &

          sleep 5

          echo "===== DASHBOARD PROCESS ====="
          pgrep -af "/home/opc/xautusd-bot/dashboard/dashboard_api.py" || true

          echo
          echo "===== PORT 8000 ====="
          ss -lntp | grep ':8000' || true

          echo
          echo "===== LOCAL HEALTH ====="
          curl -fsS http://127.0.0.1:8000/api/health

          echo
          echo "===== DASHBOARD DEBUG ====="
          curl -sS http://127.0.0.1:8000/api/debug || true

          echo
          echo "===== DASHBOARD DATA ====="
          curl -sS http://127.0.0.1:8000/api/dashboard || true

          echo

          EOF

      - name: Start Cloudflare Quick Tunnel
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
        run: |
          ssh \
            -i ~/.ssh/oracle.key \
            -o StrictHostKeyChecking=no \
            "$ORACLE_USER@$ORACLE_HOST" << 'EOF'

          cd /home/opc/xautusd-bot

          echo "===== CLOUDFLARE ====="

          CLOUDFLARED=$(command -v cloudflared || true)

          if [ -z "$CLOUDFLARED" ]; then
            echo "ERROR: cloudflared is not installed."
            exit 1
          fi

          echo "cloudflared: $CLOUDFLARED"
          "$CLOUDFLARED" version

          mkdir -p /home/opc/xautusd-bot/dashboard
          touch /home/opc/xautusd-bot/dashboard/quick-tunnel.log

          # Stop ONLY previous Quick Tunnel.
          if [ -f /home/opc/xautusd-bot/dashboard/quick-tunnel.pid ]; then

            OLD_PID=$(cat \
              /home/opc/xautusd-bot/dashboard/quick-tunnel.pid \
              2>/dev/null || true)

            if [ -n "$OLD_PID" ] && kill -0 "$OLD_PID" 2>/dev/null; then
              kill "$OLD_PID" 2>/dev/null || true
              sleep 2
            fi

            rm -f /home/opc/xautusd-bot/dashboard/quick-tunnel.pid
          fi

          : > /home/opc/xautusd-bot/dashboard/quick-tunnel.log

          echo "Starting Quick Tunnel..."

          nohup "$CLOUDFLARED" tunnel \
            --url http://127.0.0.1:8000 \
            > /home/opc/xautusd-bot/dashboard/quick-tunnel.log 2>&1 &

          TUNNEL_PID=$!

          echo "$TUNNEL_PID" \
            > /home/opc/xautusd-bot/dashboard/quick-tunnel.pid

          echo "Quick Tunnel PID: $TUNNEL_PID"

          echo "Waiting for Cloudflare URL..."

          URL=""

          for i in $(seq 1 40); do

            sleep 2

            URL=$(grep -oE \
              'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' \
              /home/opc/xautusd-bot/dashboard/quick-tunnel.log \
              | tail -n 1 || true)

            if [ -n "$URL" ]; then
              break
            fi

          done

          if [ -z "$URL" ]; then

            echo "ERROR: Cloudflare URL was not found."

            echo "===== CLOUDFLARE LOG ====="
            cat /home/opc/xautusd-bot/dashboard/quick-tunnel.log || true

            exit 1
          fi

          echo
          echo "=========================================="
          echo "CLOUDFLARE DASHBOARD URL:"
          echo "$URL"
          echo "=========================================="

          echo
          echo "HEALTH URL:"
          echo "$URL/api/health"

          echo
          echo "DASHBOARD API URL:"
          echo "$URL/api/dashboard"

          echo
          echo "DEBUG URL:"
          echo "$URL/api/debug"

          echo
          echo "===== HEALTH TEST ====="

          sleep 3

          curl -fsS "$URL/api/health"

          echo

          echo
          echo "===== DASHBOARD DATA TEST ====="

          curl -sS "$URL/api/dashboard" || true

          echo

          EOF

      - name: Verify dashboard and bot
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
        run: |
          ssh \
            -i ~/.ssh/oracle.key \
            -o StrictHostKeyChecking=no \
            "$ORACLE_USER@$ORACLE_HOST" << 'EOF'

          echo "===== BOT CHECK ====="

          pgrep -af \
            "/home/opc/xautusd-bot/bot.py" \
            || true

          echo
          echo "===== DASHBOARD API CHECK ====="

          pgrep -af \
            "/home/opc/xautusd-bot/dashboard/dashboard_api.py" \
            || true

          echo
          echo "===== PORT 8000 ====="

          ss -lntp | grep ':8000' || true

          echo
          echo "===== CLOUDFLARE QUICK TUNNEL ====="

          if [ -f /home/opc/xautusd-bot/dashboard/quick-tunnel.pid ]; then

            PID=$(cat \
              /home/opc/xautusd-bot/dashboard/quick-tunnel.pid)

            ps -p "$PID" -f || true

          fi

          echo
          echo "===== LOCAL HEALTH ====="

          curl -fsS \
            http://127.0.0.1:8000/api/health

          echo

          echo
          echo "===== LOCAL DEBUG ====="

          curl -sS \
            http://127.0.0.1:8000/api/debug \
            || true

          echo

          EOF
