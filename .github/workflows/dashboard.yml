name: Update Dashboard Data

on:
  schedule:
    - cron: '*/5 * * * *'  # Runs automatically every 5 minutes
  workflow_dispatch:        # Allows manual run from Actions tab
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests python-dotenv flask flask-cors

      - name: Ensure State File Exists
        run: |
          if [ ! -f xautusd_state.json ]; then
            echo '{}' > xautusd_state.json
          fi

      - name: Generate Dashboard JSON from Delta API
        env:
          DELTA_API_KEY: ${{ secrets.DELTA_API_KEY }}
          DELTA_API_SECRET: ${{ secrets.DELTA_API_SECRET }}
          DELTA_SYMBOL: 'XAUTUSD'
          DELTA_BASE_URL: 'https://api.india.delta.exchange'
        run: |
          python3 -c "import json; from dashboard_api import build_dashboard; print(json.dumps(build_dashboard()))" > dashboard.json

      - name: Commit and Push Dashboard Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard.json
          git diff --staged --quiet || (git commit -m "Auto-update live dashboard data" && git push)
