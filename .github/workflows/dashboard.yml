name: Deploy Dashboard API

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "dashboard_api.py"
      - ".github/workflows/dashboard.yml"

jobs:
  deploy-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare SSH
        env:
          ORACLE_PRIVATE_KEY: ${{ secrets.ORACLE_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$ORACLE_PRIVATE_KEY" > ~/.ssh/oracle.key
          chmod 600 ~/.ssh/oracle.key

          echo "Checking SSH key..."
          ssh-keygen -y -f ~/.ssh/oracle.key > /dev/null
          echo "SSH key is valid."

      - name: Check Oracle connection
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
        run: |
          ssh \
            -i ~/.ssh/oracle.key \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=30 \
            "$ORACLE_USER@$ORACLE_HOST" \
            "echo 'Oracle SSH connection OK'"

      - name: Deploy Dashboard API
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
        run: |
          ssh \
            -i ~/.ssh/oracle.key \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=30 \
            "$ORACLE_USER@$ORACLE_HOST" \
            "mkdir -p /home/opc/xautusd-bot/dashboard"

          scp \
            -i ~/.ssh/oracle.key \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=30 \
            dashboard_api.py \
            "$ORACLE_USER@$ORACLE_HOST:/home/opc/xautusd-bot/dashboard/dashboard_api.py"

      - name: Check Dashboard API
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
        run: |
          ssh \
            -i ~/.ssh/oracle.key \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=30 \
            "$ORACLE_USER@$ORACLE_HOST" << 'EOF'

          echo "======================================"
          echo "DASHBOARD / BOT SAFETY CHECK"
          echo "======================================"

          echo ""
          echo "===== BOT PROCESS ====="
          pgrep -af "/home/opc/xautusd-bot/bot.py" || echo "Bot process not found"

          echo ""
          echo "===== PORT 8000 ====="
          ss -lntp | grep ':8000' || echo "Nothing listening on port 8000"

          echo ""
          echo "===== DASHBOARD API PROCESS ====="
          pgrep -af "dashboard/dashboard_api.py" || echo "Dashboard API process not found"

          echo ""
          echo "===== DASHBOARD HEALTH ====="
          curl -sS --max-time 10 http://127.0.0.1:8000/api/health || true

          echo ""
          echo ""
          echo "===== DASHBOARD DATA ====="
          curl -sS --max-time 10 http://127.0.0.1:8000/api/dashboard || true

          echo ""
          echo ""
          echo "===== DASHBOARD LOG ====="
          tail -30 /home/opc/xautusd-bot/dashboard/dashboard.log 2>/dev/null || echo "No dashboard log found"

          echo ""
          echo "======================================"
          echo "CHECK COMPLETE"
          echo "======================================"

          EOF
