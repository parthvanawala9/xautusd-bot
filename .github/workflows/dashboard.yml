name: Deploy Dashboard API

on:
  push:
    branches:
      - main
    paths:
      - "dashboard_api.py"
      - "requirements.txt"
      - ".github/workflows/dashboard.yml"
  workflow_dispatch:

jobs:
  deploy-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.OCI_SSH_KEY }}" > ~/.ssh/oci_key
          chmod 600 ~/.ssh/oci_key
          ssh-keyscan -H "${{ secrets.OCI_HOST }}" >> ~/.ssh/known_hosts

      - name: Copy dashboard API
        run: |
          for i in 1 2 3 4 5; do
            scp \
              -i ~/.ssh/oci_key \
              -o ConnectTimeout=20 \
              -o ConnectionAttempts=3 \
              -o ServerAliveInterval=15 \
              -o ServerAliveCountMax=3 \
              dashboard_api.py \
              "${{ secrets.OCI_USER }}@${{ secrets.OCI_HOST }}:/home/opc/dashboard_api.py" && break
            echo "SSH attempt $i failed. Retrying..."
            sleep 10
          done

      - name: Start dashboard API
        run: |
          for i in 1 2 3 4 5; do
            ssh \
              -i ~/.ssh/oci_key \
              -o ConnectTimeout=20 \
              -o ConnectionAttempts=3 \
              -o ServerAliveInterval=15 \
              -o ServerAliveCountMax=3 \
              "${{ secrets.OCI_USER }}@${{ secrets.OCI_HOST }}" \
              'cd /home/opc && python3 -m pip install -r requirements.txt && pkill -f "dashboard_api.py" || true; nohup python3 dashboard_api.py > dashboard_api.log 2>&1 &' && break
            echo "SSH attempt $i failed. Retrying..."
            sleep 10
          done
