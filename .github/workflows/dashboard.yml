name: Deploy Dashboard API

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy-dashboard:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ============================================================
      # SSH
      # ============================================================

      - name: Prepare SSH
        env:
          ORACLE_PRIVATE_KEY: ${{ secrets.ORACLE_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh

          printf '%s\n' "$ORACLE_PRIVATE_KEY" \
            > ~/.ssh/oracle.key

          chmod 600 ~/.ssh/oracle.key


      # ============================================================
      # COPY DASHBOARD API
      # ============================================================

      - name: Copy dashboard API
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
        run: |

          ssh \
            -i ~/.ssh/oracle.key \
            -o StrictHostKeyChecking=no \
            "$ORACLE_USER@$ORACLE_HOST" \
            "mkdir -p /home/opc/xautusd-bot/dashboard"

          scp \
            -i ~/.ssh/oracle.key \
            -o StrictHostKeyChecking=no \
            dashboard_api.py \
            "$ORACLE_USER@$ORACLE_HOST:/home/opc/xautusd-bot/dashboard/dashboard_api.py"


      # ============================================================
      # DASHBOARD API
      #
      # IMPORTANT:
      # ONLY dashboard_api.py is restarted.
      # bot.py is NOT touched.
      # ============================================================

      - name: Install dashboard dependencies and start API
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
        run: |

          ssh \
            -i ~/.ssh/oracle.key \
            -o StrictHostKeyChecking=no \
            "$ORACLE_USER@$ORACLE_HOST" << 'EOF'

          set -e

          cd /home/opc/xautusd-bot

          echo "=========================================="
          echo "INSTALL DASHBOARD DEPENDENCIES"
          echo "=========================================="

          python3 -m pip install --user \
            flask \
            flask-cors \
            requests \
            python-dotenv


          echo "=========================================="
          echo "RESTART ONLY DASHBOARD API"
          echo "=========================================="

          pkill -f \
            "/home/opc/xautusd-bot/dashboard/dashboard_api.py" \
            || true

          sleep 2

          nohup python3 \
            /home/opc/xautusd-bot/dashboard/dashboard_api.py \
            > /home/opc/xautusd-bot/dashboard/dashboard.log 2>&1 &

          sleep 5


          echo "=========================================="
          echo "DASHBOARD PROCESS"
          echo "=========================================="

          pgrep -af \
            "/home/opc/xautusd-bot/dashboard/dashboard_api.py" \
            || true


          echo "=========================================="
          echo "PORT 8000"
          echo "=========================================="

          ss -lntp | grep ':8000' || true


          echo "=========================================="
          echo "LOCAL HEALTH CHECK"
          echo "=========================================="

          curl -fsS \
            http://127.0.0.1:8000/api/health

          echo

          EOF


      # ============================================================
      # CLOUDFLARE QUICK TUNNEL
      # ============================================================

      - name: Install persistent Cloudflare Quick Tunnel
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
        run: |

          ssh \
            -i ~/.ssh/oracle.key \
            -o StrictHostKeyChecking=no \
            "$ORACLE_USER@$ORACLE_HOST" << 'EOF'

          set -e

          DASHBOARD_DIR="/home/opc/xautusd-bot/dashboard"
          CLOUDFLARE_LOG="$DASHBOARD_DIR/cloudflare.log"
          SERVICE_NAME="xautusd-dashboard.service"


          echo "=========================================="
          echo "CHECK CLOUDFLARED"
          echo "=========================================="

          CLOUDFLARED_PATH=$(command -v cloudflared || true)

          if [ -z "$CLOUDFLARED_PATH" ]; then
            echo "ERROR: cloudflared is not installed."
            exit 1
          fi

          echo "cloudflared path:"
          echo "$CLOUDFLARED_PATH"

          echo
          cloudflared version


          echo "=========================================="
          echo "PREPARE DASHBOARD DIRECTORY"
          echo "=========================================="

          mkdir -p "$DASHBOARD_DIR"

          touch "$CLOUDFLARE_LOG"

          chmod 664 "$CLOUDFLARE_LOG"


          echo "=========================================="
          echo "STOP OLD DASHBOARD CLOUDFLARE SERVICE"
          echo "=========================================="

          sudo systemctl stop "$SERVICE_NAME" \
            2>/dev/null || true


          echo "=========================================="
          echo "REMOVE OLD QUICK TUNNEL PROCESS"
          echo "=========================================="

          if [ -f "$DASHBOARD_DIR/quick-tunnel.pid" ]; then

            OLD_PID=$(cat \
              "$DASHBOARD_DIR/quick-tunnel.pid" \
              2>/dev/null || true)

            if [ -n "$OLD_PID" ]; then
              kill "$OLD_PID" \
                2>/dev/null || true
            fi

            rm -f \
              "$DASHBOARD_DIR/quick-tunnel.pid"

          fi


          echo "=========================================="
          echo "CLEAR OLD CLOUDFLARE LOG"
          echo "=========================================="

          : > "$CLOUDFLARE_LOG"


          echo "=========================================="
          echo "CREATE SYSTEMD SERVICE"
          echo "=========================================="

          sudo tee "/etc/systemd/system/$SERVICE_NAME" > /dev/null << SERVICE

          [Unit]
          Description=XAUTUSD Dashboard Cloudflare Quick Tunnel
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          User=opc
          WorkingDirectory=/home/opc/xautusd-bot

          ExecStart=$CLOUDFLARED_PATH tunnel --url http://127.0.0.1:8000

          Restart=always
          RestartSec=5

          StandardOutput=append:$CLOUDFLARE_LOG
          StandardError=append:$CLOUDFLARE_LOG

          [Install]
          WantedBy=multi-user.target

          SERVICE


          echo "=========================================="
          echo "ENABLE SERVICE"
          echo "=========================================="

          sudo systemctl daemon-reload

          sudo systemctl enable "$SERVICE_NAME"


          echo "=========================================="
          echo "START CLOUDFLARE"
          echo "=========================================="

          sudo systemctl restart "$SERVICE_NAME"

          sleep 8


          echo "=========================================="
          echo "SERVICE STATUS"
          echo "=========================================="

          sudo systemctl --no-pager \
            status "$SERVICE_NAME" \
            || true


          echo "=========================================="
          echo "WAIT FOR CLOUDFLARE URL"
          echo "=========================================="

          URL=""

          for i in $(seq 1 40); do

            sleep 2

            URL=$(grep -oE \
              'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' \
              "$CLOUDFLARE_LOG" \
              | tail -n 1 \
              || true)

            if [ -n "$URL" ]; then
              break
            fi

          done


          if [ -z "$URL" ]; then

            echo
            echo "ERROR: CLOUDFLARE URL WAS NOT CREATED."
            echo

            echo "===== SYSTEMD STATUS ====="

            sudo systemctl --no-pager \
              status "$SERVICE_NAME" \
              || true

            echo
            echo "===== SYSTEMD JOURNAL ====="

            sudo journalctl \
              -u "$SERVICE_NAME" \
              -n 100 \
              --no-pager \
              || true

            echo
            echo "===== CLOUDFLARE LOG ====="

            cat "$CLOUDFLARE_LOG" \
              || true

            exit 1

          fi


          echo
          echo "=========================================="
          echo "CLOUDFLARE DASHBOARD URL"
          echo "=========================================="

          echo "$URL"

          echo
          echo "=========================================="
          echo "HEALTH URL"
          echo "=========================================="

          echo "$URL/api/health"

          echo
          echo "=========================================="
          echo "DASHBOARD API URL"
          echo "=========================================="

          echo "$URL/api/dashboard"


          echo
          echo "=========================================="
          echo "TEST CLOUDFLARE HEALTH"
          echo "=========================================="

          sleep 3

          curl -fsS \
            "$URL/api/health"

          echo


          echo
          echo "=========================================="
          echo "TEST DASHBOARD DATA"
          echo "=========================================="

          curl -fsS \
            "$URL/api/dashboard"

          echo

          EOF


      # ============================================================
      # FINAL CHECK
      # ============================================================

      - name: Verify dashboard and bot
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
        run: |

          ssh \
            -i ~/.ssh/oracle.key \
            -o StrictHostKeyChecking=no \
            "$ORACLE_USER@$ORACLE_HOST" << 'EOF'

          echo
          echo "=========================================="
          echo "FINAL VERIFICATION"
          echo "=========================================="


          echo
          echo "===== BOT CHECK ====="

          pgrep -af \
            "/home/opc/xautusd-bot/bot.py" \
            || true


          echo
          echo "===== DASHBOARD API CHECK ====="

          pgrep -af \
            "/home/opc/xautusd-bot/dashboard/dashboard_api.py" \
            || true


          echo
          echo "===== PORT 8000 ====="

          ss -lntp | grep ':8000' \
            || true


          echo
          echo "===== CLOUDFLARE SERVICE ====="

          sudo systemctl is-enabled \
            xautusd-dashboard.service \
            || true

          sudo systemctl is-active \
            xautusd-dashboard.service \
            || true


          echo
          echo "===== CLOUDFLARE PROCESS ====="

          pgrep -af \
            "cloudflared tunnel --url http://127.0.0.1:8000" \
            || true


          echo
          echo "===== LOCAL API ====="

          curl -fsS \
            http://127.0.0.1:8000/api/health

          echo


          echo
          echo "=========================================="
          echo "DEPLOYMENT COMPLETE"
          echo "=========================================="

          EOF
