name: Deploy Dashboard API

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "dashboard_api.py"
      - ".github/workflows/dashboard.yml"

jobs:
  deploy-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare SSH
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" | tr -d '\r' > ~/.ssh/oracle.key
          chmod 600 ~/.ssh/oracle.key

          ssh-keygen -y -f ~/.ssh/oracle.key > /dev/null

      - name: Copy dashboard API
        run: |
          scp \
            -i ~/.ssh/oracle.key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=30 \
            dashboard_api.py \
            opc@80.225.246.202:/home/opc/dashboard_api.py

      - name: Start dashboard API
        run: |
          ssh \
            -i ~/.ssh/oracle.key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=30 \
            opc@80.225.246.202 << 'EOF'

          cd /home/opc

          python3 -m pip install --user flask flask-cors

          pkill -f "dashboard_api.py" || true

          nohup python3 dashboard_api.py \
            > dashboard_api.log 2>&1 &

          sleep 5

          curl -f http://127.0.0.1:8000/api/health

          EOF
