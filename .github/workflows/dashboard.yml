name: Deploy Dashboard API

on:
  push:
    branches:
      - main
    paths:
      - "dashboard_api.py"
      - "requirements.txt"
      - ".github/workflows/dashboard.yml"
  workflow_dispatch:

jobs:
  deploy-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare SSH
        env:
          SSH_KEY: ${{ secrets.OCI_SSH_KEY }}
        run: |
          KEY_FILE="$RUNNER_TEMP/oci_key"
          printf '%s\n' "$SSH_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          ssh-keyscan -H 80.225.246.202 > "$RUNNER_TEMP/known_hosts"

      - name: Copy dashboard API
        run: |
          scp \
            -i "$RUNNER_TEMP/oci_key" \
            -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=30 \
            dashboard_api.py \
            opc@80.225.246.202:/home/opc/dashboard_api.py

      - name: Copy requirements
        run: |
          scp \
            -i "$RUNNER_TEMP/oci_key" \
            -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=30 \
            requirements.txt \
            opc@80.225.246.202:/home/opc/requirements.txt

      - name: Start dashboard API
        run: |
          ssh \
            -i "$RUNNER_TEMP/oci_key" \
            -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=30 \
            opc@80.225.246.202 '
              cd /home/opc
              python3 -m pip install -r requirements.txt
              pkill -f "dashboard_api.py" || true
              nohup python3 dashboard_api.py > dashboard_api.log 2>&1 &
              sleep 3
              curl -f http://127.0.0.1:8000/api/dashboard
            '
