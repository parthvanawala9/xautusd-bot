name: Deploy XAUTUSD Bot + Dashboard

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:

  deploy:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Prepare SSH
        env:
          ORACLE_PRIVATE_KEY: ${{ secrets.ORACLE_PRIVATE_KEY }}

        run: |

          mkdir -p ~/.ssh

          printf '%s\n' \
            "$ORACLE_PRIVATE_KEY" \
            > ~/.ssh/oracle.key

          chmod 600 ~/.ssh/oracle.key


      - name: Test Oracle SSH
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}

        run: |

          ssh \
            -i ~/.ssh/oracle.key \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=20 \
            -o ConnectionAttempts=2 \
            -o ServerAliveInterval=10 \
            -o ServerAliveCountMax=3 \
            "$ORACLE_USER@$ORACLE_HOST" \
            "echo ORACLE_SSH_OK"


      - name: Copy Bot
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}

        run: |

          scp \
            -i ~/.ssh/oracle.key \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=20 \
            bot.py \
            "$ORACLE_USER@$ORACLE_HOST:/home/opc/xautusd-bot/bot.py"


      - name: Copy Dashboard
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}

        run: |

          ssh \
            -i ~/.ssh/oracle.key \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=20 \
            "$ORACLE_USER@$ORACLE_HOST" \
            "mkdir -p /home/opc/xautusd-bot/dashboard"

          scp \
            -i ~/.ssh/oracle.key \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=20 \
            dashboard/index.html \
            dashboard/app.js \
            dashboard/style.css \
            "$ORACLE_USER@$ORACLE_HOST:/home/opc/xautusd-bot/dashboard/"


      - name: Install Python Dependencies
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}

        run: |

          ssh \
            -i ~/.ssh/oracle.key \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=20 \
            "$ORACLE_USER@$ORACLE_HOST" << 'EOF'

          cd /home/opc/xautusd-bot

          python3 -m pip install \
            --user \
            requests \
            websocket-client \
            python-dotenv

          EOF


      - name: Restart XAUTUSD Bot
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}

        run: |

          ssh \
            -i ~/.ssh/oracle.key \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=20 \
            "$ORACLE_USER@$ORACLE_HOST" << 'EOF'

          echo "===== RESTART BOT ====="

          sudo systemctl restart xautusd-bot.service

          sleep 5

          echo
          echo "===== SERVICE STATUS ====="

          sudo systemctl --no-pager status \
            xautusd-bot.service \
            || true

          echo
          echo "===== PORT 8000 ====="

          ss -lntp | grep ':8000' || true

          echo
          echo "===== DASHBOARD HEALTH ====="

          curl \
            --max-time 10 \
            -fsS \
            http://127.0.0.1:8000/api/health

          echo

          echo
          echo "===== DASHBOARD DATA ====="

          curl \
            --max-time 15 \
            -fsS \
            http://127.0.0.1:8000/api/dashboard

          echo

          EOF


      - name: Final Bot Check
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}

        run: |

          ssh \
            -i ~/.ssh/oracle.key \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=20 \
            "$ORACLE_USER@$ORACLE_HOST" << 'EOF'

          echo
          echo "========================================"
          echo "FINAL XAUTUSD BOT CHECK"
          echo "========================================"

          sudo systemctl is-active \
            xautusd-bot.service

          echo
          echo "===== BOT PROCESS ====="

          pgrep -af \
            "/home/opc/xautusd-bot/bot.py" \
            || true

          echo
          echo "===== DASHBOARD PORT ====="

          ss -lntp | grep ':8000' \
            || true

          echo
          echo "===== HEALTH ====="

          curl \
            --max-time 10 \
            -fsS \
            http://127.0.0.1:8000/api/health

          echo

          EOF
