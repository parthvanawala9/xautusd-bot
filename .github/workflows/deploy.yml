name: Deploy XAUTUSD Bot + Dashboard

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read


jobs:

  deploy:

    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # CHECKOUT
      # =====================================================

      - name: Checkout
        uses: actions/checkout@v4


      # =====================================================
      # PREPARE SSH
      # =====================================================

      - name: Prepare SSH
        env:
          ORACLE_PRIVATE_KEY: ${{ secrets.ORACLE_PRIVATE_KEY }}

        run: |

          set -e

          mkdir -p ~/.ssh

          printf '%s\n' "$ORACLE_PRIVATE_KEY" \
            > ~/.ssh/oracle.key

          chmod 600 ~/.ssh/oracle.key

          ssh-keygen \
            -y \
            -f ~/.ssh/oracle.key \
            > /dev/null

          echo "SSH KEY OK"


      # =====================================================
      # CHECK PYTHON SYNTAX BEFORE TOUCHING ORACLE
      # =====================================================

      - name: Check bot.py Syntax
        run: |

          set -e

          python3 -m py_compile bot.py

          echo "BOT_PY_SYNTAX_OK"


      # =====================================================
      # COPY FILES TO ORACLE
      #
      # Files are first copied to a temporary directory.
      # Existing running bot is NOT touched during upload.
      # =====================================================

      - name: Upload Bot And Dashboard
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}

        run: |

          set -e

          echo "========================================"
          echo "CONNECTING TO ORACLE"
          echo "========================================"

          SSH_OPTIONS="
            -i ~/.ssh/oracle.key
            -o StrictHostKeyChecking=no
            -o UserKnownHostsFile=/dev/null
            -o ConnectTimeout=60
            -o ConnectionAttempts=5
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=4
          "

          echo "Testing SSH connection..."

          ssh \
            -i ~/.ssh/oracle.key \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=60 \
            -o ConnectionAttempts=5 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4 \
            "$ORACLE_USER@$ORACLE_HOST" \
            "echo ORACLE_SSH_OK"


          echo
          echo "Creating temporary deployment directory..."

          ssh \
            -i ~/.ssh/oracle.key \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=60 \
            -o ConnectionAttempts=5 \
            "$ORACLE_USER@$ORACLE_HOST" \
            "mkdir -p /home/opc/xautusd-bot/.deploy_tmp"


          echo
          echo "Uploading files..."


          scp \
            -i ~/.ssh/oracle.key \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=60 \
            -o ConnectionAttempts=5 \
            bot.py \
            index.html \
            app.js \
            style.css \
            "$ORACLE_USER@$ORACLE_HOST:/home/opc/xautusd-bot/.deploy_tmp/"


          echo
          echo "UPLOAD_OK"


      # =====================================================
      # INSTALL NEW FILES
      #
      # Existing accounts.json and state/history directories
      # are NOT touched.
      # =====================================================

      - name: Install New Files
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}

        run: |

          set -e

          ssh \
            -i ~/.ssh/oracle.key \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=60 \
            -o ConnectionAttempts=5 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4 \
            "$ORACLE_USER@$ORACLE_HOST" << 'EOF'

          set -e

          BOT_DIR="/home/opc/xautusd-bot"
          TMP_DIR="$BOT_DIR/.deploy_tmp"

          echo "========================================"
          echo "INSTALLING NEW BOT + DASHBOARD FILES"
          echo "========================================"

          test -f "$TMP_DIR/bot.py"
          test -f "$TMP_DIR/index.html"
          test -f "$TMP_DIR/app.js"
          test -f "$TMP_DIR/style.css"

          echo "All uploaded files found."

          echo
          echo "Checking Python syntax on Oracle..."

          python3 -m py_compile "$TMP_DIR/bot.py"

          echo "ORACLE_BOT_SYNTAX_OK"

          echo
          echo "Replacing application files..."

          cp "$TMP_DIR/bot.py" \
             "$BOT_DIR/bot.py"

          cp "$TMP_DIR/index.html" \
             "$BOT_DIR/index.html"

          cp "$TMP_DIR/app.js" \
             "$BOT_DIR/app.js"

          cp "$TMP_DIR/style.css" \
             "$BOT_DIR/style.css"

          rm -rf "$TMP_DIR"

          echo
          echo "FILES_INSTALLED_OK"

          EOF


      # =====================================================
      # RESTART BOT + DASHBOARD
      # =====================================================

      - name: Restart XAUTUSD Bot
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}

        run: |

          set -e

          ssh \
            -i ~/.ssh/oracle.key \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=60 \
            -o ConnectionAttempts=5 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4 \
            "$ORACLE_USER@$ORACLE_HOST" << 'EOF'

          echo "========================================"
          echo "RESTART XAUTUSD BOT + DASHBOARD"
          echo "========================================"

          sudo systemctl restart xautusd-bot.service

          echo
          echo "Waiting for service startup..."

          sleep 10

          echo
          echo "===== SERVICE STATUS ====="

          sudo systemctl --no-pager status \
            xautusd-bot.service || true

          EOF


      # =====================================================
      # VERIFY BOT
      # =====================================================

      - name: Verify XAUTUSD Bot
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}

        run: |

          set -e

          ssh \
            -i ~/.ssh/oracle.key \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=60 \
            -o ConnectionAttempts=5 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4 \
            "$ORACLE_USER@$ORACLE_HOST" << 'EOF'

          echo "========================================"
          echo "BOT VERIFICATION"
          echo "========================================"


          if sudo systemctl is-active --quiet \
            xautusd-bot.service; then

            echo "XAUTUSD_BOT_ACTIVE"

          else

            echo "XAUTUSD_BOT_FAILED"

            echo
            echo "===== SERVICE STATUS ====="

            sudo systemctl --no-pager status \
              xautusd-bot.service || true

            echo
            echo "===== RECENT LOGS ====="

            sudo journalctl \
              -u xautusd-bot.service \
              -n 80 \
              --no-pager

            exit 1

          fi


          echo
          echo "===== BOT PROCESS ====="

          pgrep -af \
            "/home/opc/xautusd-bot/bot.py" || true


          echo
          echo "===== RECENT BOT LOGS ====="

          sudo journalctl \
            -u xautusd-bot.service \
            -n 40 \
            --no-pager

          EOF


      # =====================================================
      # VERIFY DASHBOARD
      # =====================================================

      - name: Verify Dashboard
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}

        run: |

          set -e

          ssh \
            -i ~/.ssh/oracle.key \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=60 \
            -o ConnectionAttempts=5 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4 \
            "$ORACLE_USER@$ORACLE_HOST" << 'EOF'

          echo "========================================"
          echo "DASHBOARD VERIFICATION"
          echo "========================================"


          echo
          echo "===== PORT 8000 ====="

          if ss -lnt | grep -q ':8000'; then

            echo "DASHBOARD_PORT_8000_OK"

          else

            echo "DASHBOARD_PORT_8000_FAILED"

            echo
            echo "===== BOT LOGS ====="

            sudo journalctl \
              -u xautusd-bot.service \
              -n 80 \
              --no-pager

            exit 1

          fi


          echo
          echo "===== HEALTH ====="

          curl \
            --max-time 20 \
            -fsS \
            http://127.0.0.1:8000/api/health

          echo


          echo
          echo "===== DASHBOARD DATA ====="

          curl \
            --max-time 20 \
            -fsS \
            http://127.0.0.1:8000/api/dashboard

          echo


          echo
          echo "===== DASHBOARD PAGE ====="

          curl \
            --max-time 20 \
            -fsS \
            http://127.0.0.1:8000/ \
            > /dev/null

          echo "DASHBOARD_PAGE_OK"

          EOF


      # =====================================================
      # CLOUDFLARE QUICK TUNNEL
      # =====================================================

      - name: Start Cloudflare Quick Tunnel
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}

        run: |

          set -e

          ssh \
            -i ~/.ssh/oracle.key \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=60 \
            -o ConnectionAttempts=5 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4 \
            "$ORACLE_USER@$ORACLE_HOST" << 'EOF'

          set -e

          echo "========================================"
          echo "START CLOUDFLARE QUICK TUNNEL"
          echo "========================================"


          CLOUDFLARED=$(command -v cloudflared || true)


          if [ -z "$CLOUDFLARED" ]; then

            echo "ERROR: cloudflared not installed"

            exit 1

          fi


          BOT_DIR="/home/opc/xautusd-bot"

          PID_FILE="$BOT_DIR/quick-tunnel.pid"

          LOG_FILE="$BOT_DIR/quick-tunnel.log"


          mkdir -p "$BOT_DIR"


          echo
          echo "Stopping previous Quick Tunnel..."


          if [ -f "$PID_FILE" ]; then

            OLD_PID=$(cat "$PID_FILE" 2>/dev/null || true)

            if [ -n "$OLD_PID" ] && \
               kill -0 "$OLD_PID" 2>/dev/null; then

              kill "$OLD_PID" 2>/dev/null || true

              sleep 3

            fi

          fi


          # Also clean up any orphaned quick tunnels.

          pkill -f \
            "cloudflared.*127.0.0.1:8000" \
            2>/dev/null || true


          rm -f "$PID_FILE"

          : > "$LOG_FILE"


          echo
          echo "Starting new Quick Tunnel..."


          nohup "$CLOUDFLARED" tunnel \
            --url http://127.0.0.1:8000 \
            > "$LOG_FILE" 2>&1 &


          TUNNEL_PID=$!


          echo "$TUNNEL_PID" > "$PID_FILE"


          echo "Tunnel PID: $TUNNEL_PID"


          URL=""


          for i in $(seq 1 40); do

            sleep 2

            URL=$(grep -oE \
              'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' \
              "$LOG_FILE" \
              | tail -n 1 || true)

            if [ -n "$URL" ]; then

              break

            fi

          done


          if [ -z "$URL" ]; then

            echo "ERROR: Cloudflare URL not found"

            echo
            echo "===== CLOUDFLARE LOG ====="

            cat "$LOG_FILE" || true

            exit 1

          fi


          echo
          echo "========================================"
          echo "DASHBOARD URL"
          echo "$URL"
          echo "========================================"


          echo
          echo "===== REMOTE HEALTH ====="

          curl \
            --max-time 30 \
            -fsS \
            "$URL/api/health"

          echo


          echo
          echo "===== REMOTE DASHBOARD ====="

          curl \
            --max-time 30 \
            -fsS \
            "$URL/api/dashboard"

          echo


          echo
          echo "========================================"
          echo "DEPLOYMENT SUCCESS"
          echo "========================================"

          EOF
