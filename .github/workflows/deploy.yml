name: Test Oracle Connection

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Test Oracle Network
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          set -e

          echo "=================================="
          echo "ORACLE HOST CHECK"
          echo "=================================="

          echo "Testing host: $ORACLE_HOST"

          echo ""
          echo "DNS / HOST:"
          getent hosts "$ORACLE_HOST" || true

          echo ""
          echo "PING:"
          ping -c 3 "$ORACLE_HOST" || true

          echo ""
          echo "PORT 22:"
          timeout 15 bash -c "</dev/tcp/$ORACLE_HOST/22" \
            && echo "PORT 22 IS OPEN" \
            || echo "PORT 22 IS NOT REACHABLE"

          echo ""
          echo "NETCAT:"
          nc -vz -w 15 "$ORACLE_HOST" 22 || true

          echo ""
          echo "=================================="
          echo "TEST COMPLETE"
          echo "=================================="
