name: Deploy XAUTUSD Bot

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/oracle.key
          chmod 600 ~/.ssh/oracle.key
          ssh-keyscan -H "${{ secrets.ORACLE_HOST }}" >> ~/.ssh/known_hosts

      - name: Copy files to Oracle
        run: |
          rsync -avz \
            --exclude '.git' \
            --exclude '.github' \
            -e "ssh -i ~/.ssh/oracle.key -o StrictHostKeyChecking=no -o ConnectTimeout=30" \
            ./ "${{ secrets.ORACLE_USER }}@${{ secrets.ORACLE_HOST }}:/home/opc/xautusd-bot/"

      - name: Run bot on Oracle
        run: |
          ssh -i ~/.ssh/oracle.key \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=30 \
            "${{ secrets.ORACLE_USER }}@${{ secrets.ORACLE_HOST }}" << 'EOF'
          
          cd /home/opc/xautusd-bot

          if [ -f requirements.txt ]; then
            python3 -m pip install --user -r requirements.txt
          fi

          pkill -f "bot.py" || true

          nohup python3 bot.py > bot.log 2>&1 &

          echo "Bot started"
          EOF
