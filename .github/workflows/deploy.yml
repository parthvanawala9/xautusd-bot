name: Deploy XAUTUSD Bot

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy files to Oracle
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          source: "bot.py,requirements.txt,README.md"
          target: "/home/opc/xautusd-bot"
          timeout: 30s
          command_timeout: 1m

      - name: Prepare Oracle server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          timeout: 30s
          command_timeout: 2m
          script: |
            mkdir -p /home/opc/xautusd-bot
            cd /home/opc/xautusd-bot
            sudo dnf install -y python3-pip
            python3 -m pip install --user -r requirements.txt
