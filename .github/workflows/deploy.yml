name: Deploy XAUTUSD Bot

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required secrets
        env:
          ORACLE_PRIVATE_KEY: ${{ secrets.ORACLE_PRIVATE_KEY }}
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
        run: |
          if [ -z "$ORACLE_PRIVATE_KEY" ]; then
            echo "ERROR: ORACLE_PRIVATE_KEY is empty or missing."
            exit 1
          fi

          if [ -z "$ORACLE_HOST" ]; then
            echo "ERROR: ORACLE_HOST is empty or missing."
            exit 1
          fi

          if [ -z "$ORACLE_USER" ]; then
            echo "ERROR: ORACLE_USER is empty or missing."
            exit 1
          fi

          echo "All required secrets are present."

      - name: Prepare SSH
        env:
          ORACLE_PRIVATE_KEY: ${{ secrets.ORACLE_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$ORACLE_PRIVATE_KEY" > ~/.ssh/oracle.key
          chmod 600 ~/.ssh/oracle.key
          echo "SSH key prepared successfully."

      - name: Test SSH connection
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
        run: |
          ssh \
            -i ~/.ssh/oracle.key \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=30 \
            "$ORACLE_USER@$ORACLE_HOST" \
            "echo SSH connection successful"

      - name: Create bot directory
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
        run: |
          ssh \
            -i ~/.ssh/oracle.key \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            "$ORACLE_USER@$ORACLE_HOST" \
            "mkdir -p /home/opc/xautusd-bot"

      - name: Copy bot files to Oracle
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
        run: |
          rsync -avz \
            --exclude='.git' \
            --exclude='.github' \
            -e "ssh -i ~/.ssh/oracle.key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30" \
            ./ \
            "$ORACLE_USER@$ORACLE_HOST:/home/opc/xautusd-bot/"

      - name: Install dependencies and start bot
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
        run: |
          ssh \
            -i ~/.ssh/oracle.key \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            "$ORACLE_USER@$ORACLE_HOST" << 'EOF'

          set -e

          cd /home/opc/xautusd-bot

          echo "=================================="
          echo "INSTALLING PYTHON"
          echo "=================================="

          if ! command -v python3 >/dev/null 2>&1; then
            echo "Python3 not found. Installing..."
            sudo dnf install -y python3
          fi

          echo "Python version:"
          python3 --version

          echo "=================================="
          echo "INSTALLING PIP"
          echo "=================================="

          if ! python3 -m pip --version >/dev/null 2>&1; then
            echo "Pip not found. Installing python3-pip..."
            sudo dnf install -y python3-pip
          fi

          echo "Pip version:"
          python3 -m pip --version

          echo "=================================="
          echo "INSTALLING BOT DEPENDENCIES"
          echo "=================================="

          if [ -f requirements.txt ]; then
            python3 -m pip install --user -r requirements.txt
          else
            echo "No requirements.txt found."
          fi

          echo "=================================="
          echo "STOPPING OLD BOT"
          echo "=================================="

          pkill -f "bot.py" || true

          sleep 2

          echo "=================================="
          echo "STARTING XAUTUSD BOT"
          echo "=================================="

          nohup python3 bot.py > bot.log 2>&1 &

          sleep 5

          if pgrep -f "python3 bot.py" >/dev/null; then
            echo "BOT IS RUNNING SUCCESSFULLY."
          else
            echo "BOT FAILED TO START."
            echo "========== BOT LOG =========="
            cat bot.log || true
            echo "============================="
            exit 1
          fi

          EOF

      - name: Deployment complete
        run: |
          echo "=================================="
          echo "XAUTUSD BOT DEPLOYMENT COMPLETE"
          echo "=================================="
