name: Deploy XAUTUSD Bot + Dashboard

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read


jobs:

  deploy:

    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # CHECKOUT
      # =====================================================

      - name: Checkout
        uses: actions/checkout@v4


      # =====================================================
      # PREPARE SSH
      # =====================================================

      - name: Prepare SSH
        env:
          ORACLE_PRIVATE_KEY: ${{ secrets.ORACLE_PRIVATE_KEY }}

        run: |

          mkdir -p ~/.ssh

          printf '%s\n' "$ORACLE_PRIVATE_KEY" \
            > ~/.ssh/oracle.key

          chmod 600 ~/.ssh/oracle.key


      # =====================================================
      # TEST ORACLE SSH
      # =====================================================

      - name: Test Oracle SSH
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}

        run: |

          ssh \
            -i ~/.ssh/oracle.key \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=20 \
            -o ConnectionAttempts=2 \
            -o ServerAliveInterval=10 \
            -o ServerAliveCountMax=3 \
            "$ORACLE_USER@$ORACLE_HOST" \
            "echo ORACLE_SSH_OK"


      # =====================================================
      # COPY BOT + DASHBOARD FILES
      #
      # ALL FILES ARE IN ROOT FOLDER
      #
      # bot.py itself starts the dashboard.
      # =====================================================

      - name: Copy Bot And Dashboard
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}

        run: |

          ssh \
            -i ~/.ssh/oracle.key \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=20 \
            "$ORACLE_USER@$ORACLE_HOST" \
            "mkdir -p /home/opc/xautusd-bot"

          scp \
            -i ~/.ssh/oracle.key \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=20 \
            bot.py \
            index.html \
            app.js \
            style.css \
            "$ORACLE_USER@$ORACLE_HOST:/home/opc/xautusd-bot/"


      # =====================================================
      # RESTART EXISTING BOT
      #
      # bot.py now starts BOTH:
      # 1. XAUTUSD trading bot
      # 2. Dashboard on 127.0.0.1:8000
      # =====================================================

      - name: Restart XAUTUSD Bot
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}

        run: |

          ssh \
            -i ~/.ssh/oracle.key \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=20 \
            "$ORACLE_USER@$ORACLE_HOST" << 'EOF'

          echo "========================================"
          echo "RESTART XAUTUSD BOT + DASHBOARD"
          echo "========================================"

          sudo systemctl restart xautusd-bot.service

          sleep 8

          echo
          echo "===== BOT SERVICE STATUS ====="

          sudo systemctl --no-pager status \
            xautusd-bot.service || true

          EOF


      # =====================================================
      # VERIFY BOT
      # =====================================================

      - name: Verify XAUTUSD Bot
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}

        run: |

          ssh \
            -i ~/.ssh/oracle.key \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=20 \
            "$ORACLE_USER@$ORACLE_HOST" << 'EOF'

          echo "========================================"
          echo "BOT VERIFICATION"
          echo "========================================"

          if sudo systemctl is-active --quiet \
            xautusd-bot.service; then

            echo "XAUTUSD_BOT_ACTIVE"

          else

            echo "XAUTUSD_BOT_FAILED"

            sudo systemctl --no-pager status \
              xautusd-bot.service || true

            exit 1

          fi


          echo
          echo "===== BOT PROCESS ====="

          pgrep -af \
            "/home/opc/xautusd-bot/bot.py" || true


          echo
          echo "===== RECENT BOT LOGS ====="

          sudo journalctl \
            -u xautusd-bot.service \
            -n 30 \
            --no-pager

          EOF


      # =====================================================
      # VERIFY DASHBOARD
      #
      # Dashboard is running INSIDE bot.py
      # =====================================================

      - name: Verify Dashboard
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}

        run: |

          ssh \
            -i ~/.ssh/oracle.key \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=20 \
            "$ORACLE_USER@$ORACLE_HOST" << 'EOF'

          echo "========================================"
          echo "DASHBOARD VERIFICATION"
          echo "========================================"


          echo
          echo "===== PORT 8000 ====="

          if ss -lnt | grep -q ':8000'; then

            echo "DASHBOARD_PORT_8000_OK"

          else

            echo "DASHBOARD_PORT_8000_FAILED"

            echo
            echo "===== BOT LOGS ====="

            sudo journalctl \
              -u xautusd-bot.service \
              -n 50 \
              --no-pager

            exit 1

          fi


          echo
          echo "===== HEALTH ====="

          curl \
            --max-time 15 \
            -fsS \
            http://127.0.0.1:8000/api/health

          echo


          echo
          echo "===== DASHBOARD DATA ====="

          curl \
            --max-time 15 \
            -fsS \
            http://127.0.0.1:8000/api/dashboard

          echo


          echo
          echo "===== DASHBOARD PAGE ====="

          curl \
            --max-time 15 \
            -fsS \
            http://127.0.0.1:8000/ \
            > /dev/null

          echo "DASHBOARD_PAGE_OK"

          EOF


      # =====================================================
      # CLOUDFLARE QUICK TUNNEL
      # =====================================================

      - name: Start Cloudflare Quick Tunnel
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}

        run: |

          ssh \
            -i ~/.ssh/oracle.key \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=20 \
            "$ORACLE_USER@$ORACLE_HOST" << 'EOF'

          CLOUDFLARED=$(command -v cloudflared || true)


          if [ -z "$CLOUDFLARED" ]; then

            echo "ERROR: cloudflared not installed"

            exit 1

          fi


          BOT_DIR="/home/opc/xautusd-bot"

          PID_FILE="$BOT_DIR/quick-tunnel.pid"

          LOG_FILE="$BOT_DIR/quick-tunnel.log"


          mkdir -p "$BOT_DIR"


          # Stop previous Quick Tunnel if running.

          if [ -f "$PID_FILE" ]; then

            OLD_PID=$(cat "$PID_FILE" 2>/dev/null || true)

            if [ -n "$OLD_PID" ] && \
               kill -0 "$OLD_PID" 2>/dev/null; then

              kill "$OLD_PID" 2>/dev/null || true

              sleep 2

            fi

          fi


          rm -f "$PID_FILE"

          : > "$LOG_FILE"


          # Start tunnel to dashboard
          # running inside bot.py.

          nohup "$CLOUDFLARED" tunnel \
            --url http://127.0.0.1:8000 \
            > "$LOG_FILE" 2>&1 &


          TUNNEL_PID=$!


          echo "$TUNNEL_PID" > "$PID_FILE"


          echo "Tunnel PID: $TUNNEL_PID"


          URL=""


          for i in $(seq 1 30); do

            sleep 2

            URL=$(grep -oE \
              'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' \
              "$LOG_FILE" \
              | tail -n 1 || true)

            if [ -n "$URL" ]; then

              break

            fi

          done


          if [ -z "$URL" ]; then

            echo "ERROR: Cloudflare URL not found"

            cat "$LOG_FILE" || true

            exit 1

          fi


          echo
          echo "========================================"
          echo "DASHBOARD URL"
          echo "$URL"
          echo "========================================"


          echo
          echo "===== REMOTE HEALTH ====="

          curl \
            --max-time 20 \
            -fsS \
            "$URL/api/health"

          echo


          echo
          echo "===== REMOTE DASHBOARD ====="

          curl \
            --max-time 20 \
            -fsS \
            "$URL/api/dashboard"

          echo


          echo
          echo "========================================"
          echo "DEPLOYMENT SUCCESS"
          echo "========================================"

          EOF
