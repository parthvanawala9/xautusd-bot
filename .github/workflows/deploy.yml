name: Deploy XAUTUSD Bot + Dashboard

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:

  deploy:

    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # CHECKOUT
      # =====================================================

      - name: Checkout
        uses: actions/checkout@v4


      # =====================================================
      # SSH
      # =====================================================

      - name: Prepare SSH
        env:
          ORACLE_PRIVATE_KEY: ${{ secrets.ORACLE_PRIVATE_KEY }}

        run: |

          mkdir -p ~/.ssh

          printf '%s\n' "$ORACLE_PRIVATE_KEY" \
            > ~/.ssh/oracle.key

          chmod 600 ~/.ssh/oracle.key


      - name: Test Oracle SSH
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}

        run: |

          ssh \
            -i ~/.ssh/oracle.key \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=20 \
            -o ConnectionAttempts=2 \
            -o ServerAliveInterval=10 \
            -o ServerAliveCountMax=3 \
            "$ORACLE_USER@$ORACLE_HOST" \
            "echo ORACLE_SSH_OK"


      # =====================================================
      # COPY BOT + DASHBOARD
      # ROOT FOLDER
      # =====================================================

      - name: Copy Bot And Dashboard
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}

        run: |

          ssh \
            -i ~/.ssh/oracle.key \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=20 \
            "$ORACLE_USER@$ORACLE_HOST" \
            "mkdir -p /home/opc/xautusd-bot"

          scp \
            -i ~/.ssh/oracle.key \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=20 \
            bot.py \
            dashboard_api.py \
            index.html \
            app.js \
            style.css \
            "$ORACLE_USER@$ORACLE_HOST:/home/opc/xautusd-bot/"


      # =====================================================
      # INSTALL DASHBOARD DEPENDENCIES
      # =====================================================

      - name: Install Dashboard Dependencies
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}

        run: |

          ssh \
            -i ~/.ssh/oracle.key \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=20 \
            "$ORACLE_USER@$ORACLE_HOST" << 'EOF'

          cd /home/opc/xautusd-bot

          echo "========================================"
          echo "INSTALL DASHBOARD"
          echo "========================================"

          python3 -m venv dashboard_venv

          /home/opc/xautusd-bot/dashboard_venv/bin/python \
            -m pip install --upgrade pip

          /home/opc/xautusd-bot/dashboard_venv/bin/pip \
            install flask flask-cors requests python-dotenv

          echo "DASHBOARD_DEPENDENCIES_OK"

          EOF


      # =====================================================
      # CREATE DASHBOARD SYSTEMD SERVICE
      # =====================================================

      - name: Create Dashboard Service
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}

        run: |

          ssh \
            -i ~/.ssh/oracle.key \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=20 \
            "$ORACLE_USER@$ORACLE_HOST" << 'EOF'

          sudo tee /etc/systemd/system/xautusd-dashboard.service > /dev/null << 'SERVICE'

          [Unit]
          Description=XAUTUSD Trading Dashboard
          After=network.target xautusd-bot.service

          [Service]
          Type=simple
          User=opc
          WorkingDirectory=/home/opc/xautusd-bot

          EnvironmentFile=/home/opc/xautusd-bot/.env

          ExecStart=/home/opc/xautusd-bot/dashboard_venv/bin/python /home/opc/xautusd-bot/dashboard_api.py

          Restart=always
          RestartSec=5

          StandardOutput=journal
          StandardError=journal

          [Install]
          WantedBy=multi-user.target

          SERVICE

          sudo systemctl daemon-reload

          sudo systemctl enable xautusd-dashboard.service

          sudo systemctl restart xautusd-dashboard.service

          sleep 5

          echo "========================================"
          echo "DASHBOARD SERVICE STATUS"
          echo "========================================"

          sudo systemctl --no-pager status \
            xautusd-dashboard.service || true

          EOF


      # =====================================================
      # VERIFY BOT
      # =====================================================

      - name: Verify XAUTUSD Bot
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}

        run: |

          ssh \
            -i ~/.ssh/oracle.key \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=20 \
            "$ORACLE_USER@$ORACLE_HOST" << 'EOF'

          echo "========================================"
          echo "BOT VERIFICATION"
          echo "========================================"

          if sudo systemctl is-active --quiet \
            xautusd-bot.service; then

            echo "XAUTUSD_BOT_ACTIVE"

          else

            echo "XAUTUSD_BOT_FAILED"

            sudo systemctl --no-pager status \
              xautusd-bot.service || true

            exit 1

          fi

          echo
          echo "===== BOT PROCESS ====="

          pgrep -af \
            "/home/opc/xautusd-bot/bot.py" || true

          EOF


      # =====================================================
      # VERIFY DASHBOARD
      # =====================================================

      - name: Verify Dashboard
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}

        run: |

          ssh \
            -i ~/.ssh/oracle.key \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=20 \
            "$ORACLE_USER@$ORACLE_HOST" << 'EOF'

          echo "========================================"
          echo "DASHBOARD VERIFICATION"
          echo "========================================"

          echo
          echo "===== DASHBOARD SERVICE ====="

          sudo systemctl is-active \
            xautusd-dashboard.service

          echo
          echo "===== DASHBOARD PROCESS ====="

          pgrep -af \
            "dashboard_api.py" || true

          echo
          echo "===== PORT 8000 ====="

          ss -lntp | grep ':8000'

          echo
          echo "===== HEALTH ====="

          curl \
            --max-time 15 \
            -fsS \
            http://127.0.0.1:8000/api/health

          echo

          echo
          echo "===== DASHBOARD DATA ====="

          curl \
            --max-time 15 \
            -fsS \
            http://127.0.0.1:8000/api/dashboard

          echo

          echo
          echo "===== DASHBOARD PAGE ====="

          curl \
            --max-time 15 \
            -fsS \
            http://127.0.0.1:8000/ \
            > /dev/null

          echo "DASHBOARD_PAGE_OK"

          EOF


      # =====================================================
      # CLOUDFLARE QUICK TUNNEL
      # =====================================================

      - name: Start Cloudflare Quick Tunnel
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}

        run: |

          ssh \
            -i ~/.ssh/oracle.key \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=20 \
            "$ORACLE_USER@$ORACLE_HOST" << 'EOF'

          CLOUDFLARED=$(command -v cloudflared || true)

          if [ -z "$CLOUDFLARED" ]; then

            echo "ERROR: cloudflared not installed"

            exit 1

          fi


          DASHBOARD_DIR="/home/opc/xautusd-bot"

          PID_FILE="$DASHBOARD_DIR/quick-tunnel.pid"

          LOG_FILE="$DASHBOARD_DIR/quick-tunnel.log"


          mkdir -p "$DASHBOARD_DIR"


          if [ -f "$PID_FILE" ]; then

            OLD_PID=$(cat "$PID_FILE" 2>/dev/null || true)

            if [ -n "$OLD_PID" ] && \
               kill -0 "$OLD_PID" 2>/dev/null; then

              kill "$OLD_PID" 2>/dev/null || true

              sleep 2

            fi

          fi


          rm -f "$PID_FILE"

          : > "$LOG_FILE"


          nohup "$CLOUDFLARED" tunnel \
            --url http://127.0.0.1:8000 \
            > "$LOG_FILE" 2>&1 &


          TUNNEL_PID=$!


          echo "$TUNNEL_PID" > "$PID_FILE"


          echo "Tunnel PID: $TUNNEL_PID"


          URL=""


          for i in $(seq 1 30); do

            sleep 2

            URL=$(grep -oE \
              'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' \
              "$LOG_FILE" \
              | tail -n 1 || true)

            if [ -n "$URL" ]; then
              break
            fi

          done


          if [ -z "$URL" ]; then

            echo "ERROR: Cloudflare URL not found"

            cat "$LOG_FILE" || true

            exit 1

          fi


          echo
          echo "========================================"
          echo "DASHBOARD URL"
          echo "$URL"
          echo "========================================"


          echo
          echo "===== REMOTE HEALTH ====="

          curl \
            --max-time 20 \
            -fsS \
            "$URL/api/health"

          echo


          echo
          echo "===== REMOTE DASHBOARD ====="

          curl \
            --max-time 20 \
            -fsS \
            "$URL/api/dashboard"

          echo

          EOF
