name: Deploy XAUTUSD Bot + Dashboard

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read


jobs:

  deploy:

    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # CHECKOUT
      # =====================================================

      - name: Checkout
        uses: actions/checkout@v4


      # =====================================================
      # PREPARE SSH
      # =====================================================

      - name: Prepare SSH
        env:
          ORACLE_PRIVATE_KEY: ${{ secrets.ORACLE_PRIVATE_KEY }}

        run: |

          set -e

          mkdir -p ~/.ssh

          printf '%s\n' "$ORACLE_PRIVATE_KEY" \
            > ~/.ssh/oracle.key

          chmod 600 ~/.ssh/oracle.key

          ssh-keygen \
            -y \
            -f ~/.ssh/oracle.key \
            > /dev/null

          echo "SSH KEY OK"


      # =====================================================
      # CHECK BOT SYNTAX
      # =====================================================

      - name: Check bot.py Syntax
        run: |

          set -e

          python3 -m py_compile bot.py

          echo "BOT_PY_SYNTAX_OK"


      # =====================================================
      # TEST ORACLE SSH
      #
      # IMPORTANT:
      # Retry the COMPLETE SSH connection several times.
      #
      # We do NOT use ConnectionAttempts=5 here because a
      # single SSH command can get stuck during banner
      # exchange for a long time.
      # =====================================================

      - name: Test Oracle SSH
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}

        run: |

          set -e

          echo "========================================"
          echo "TESTING ORACLE SSH"
          echo "========================================"


          SUCCESS=0


          for ATTEMPT in 1 2 3 4 5; do

            echo
            echo "SSH ATTEMPT $ATTEMPT / 5"


            if ssh \
              -i ~/.ssh/oracle.key \
              -o BatchMode=yes \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -o ConnectTimeout=15 \
              -o ConnectionAttempts=1 \
              -o ServerAliveInterval=10 \
              -o ServerAliveCountMax=2 \
              "$ORACLE_USER@$ORACLE_HOST" \
              "echo ORACLE_SSH_OK"; then

              SUCCESS=1

              break

            fi


            echo "SSH attempt failed."


            if [ "$ATTEMPT" -lt 5 ]; then

              echo "Waiting 5 seconds before retry..."

              sleep 5

            fi

          done


          if [ "$SUCCESS" -ne 1 ]; then

            echo
            echo "========================================"
            echo "ORACLE SSH FAILED"
            echo "========================================"

            echo
            echo "Host: $ORACLE_HOST"
            echo "User: $ORACLE_USER"

            echo
            echo "GitHub Actions could not establish"
            echo "a stable SSH session with Oracle."

            exit 1

          fi


          echo
          echo "========================================"
          echo "ORACLE_SSH_OK"
          echo "========================================"


      # =====================================================
      # CREATE DEPLOY DIRECTORY
      # =====================================================

      - name: Prepare Oracle Deployment Directory
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}

        run: |

          set -e


          ssh \
            -i ~/.ssh/oracle.key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=15 \
            -o ConnectionAttempts=1 \
            -o ServerAliveInterval=10 \
            -o ServerAliveCountMax=2 \
            "$ORACLE_USER@$ORACLE_HOST" \
            "mkdir -p /home/opc/xautusd-bot/.deploy_tmp"


          echo "ORACLE_DEPLOY_DIRECTORY_OK"


      # =====================================================
      # UPLOAD FILES
      # =====================================================

      - name: Upload Bot And Dashboard
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}

        run: |

          set -e


          echo "========================================"
          echo "UPLOADING BOT + DASHBOARD"
          echo "========================================"


          scp \
            -i ~/.ssh/oracle.key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=15 \
            -o ConnectionAttempts=1 \
            -o ServerAliveInterval=10 \
            -o ServerAliveCountMax=2 \
            bot.py \
            index.html \
            app.js \
            style.css \
            "$ORACLE_USER@$ORACLE_HOST:/home/opc/xautusd-bot/.deploy_tmp/"


          echo
          echo "UPLOAD_OK"


      # =====================================================
      # INSTALL FILES
      #
      # IMPORTANT:
      #
      # Existing runtime data is NOT deleted.
      #
      # accounts.json
      # account_states/
      # account_history/
      # client_accounts.json
      #
      # remain untouched.
      # =====================================================

      - name: Install New Files
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}

        run: |

          set -e


          ssh \
            -i ~/.ssh/oracle.key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=15 \
            -o ConnectionAttempts=1 \
            -o ServerAliveInterval=10 \
            -o ServerAliveCountMax=2 \
            "$ORACLE_USER@$ORACLE_HOST" << 'EOF'


          set -e


          BOT_DIR="/home/opc/xautusd-bot"

          TMP_DIR="$BOT_DIR/.deploy_tmp"


          echo "========================================"

          echo "INSTALLING FILES"

          echo "========================================"


          test -f "$TMP_DIR/bot.py"

          test -f "$TMP_DIR/index.html"

          test -f "$TMP_DIR/app.js"

          test -f "$TMP_DIR/style.css"


          echo

          echo "All uploaded files found."


          echo

          echo "Checking bot.py syntax..."


          python3 -m py_compile \
            "$TMP_DIR/bot.py"


          echo "ORACLE_BOT_SYNTAX_OK"


          echo

          echo "Installing application files..."


          cp \
            "$TMP_DIR/bot.py" \
            "$BOT_DIR/bot.py"


          cp \
            "$TMP_DIR/index.html" \
            "$BOT_DIR/index.html"


          cp \
            "$TMP_DIR/app.js" \
            "$BOT_DIR/app.js"


          cp \
            "$TMP_DIR/style.css" \
            "$BOT_DIR/style.css"


          rm -rf \
            "$TMP_DIR"


          echo

          echo "FILES_INSTALLED_OK"


          EOF


      # =====================================================
      # RESTART BOT
      #
      # bot.py starts the dashboard.
      # =====================================================

      - name: Restart XAUTUSD Bot
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}

        run: |

          set -e


          ssh \
            -i ~/.ssh/oracle.key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=15 \
            -o ConnectionAttempts=1 \
            -o ServerAliveInterval=10 \
            -o ServerAliveCountMax=2 \
            "$ORACLE_USER@$ORACLE_HOST" << 'EOF'


          set -e


          echo "========================================"

          echo "RESTARTING XAUTUSD BOT"

          echo "========================================"


          sudo systemctl restart \
            xautusd-bot.service


          echo

          echo "Waiting for bot..."

          sleep 8


          if sudo systemctl is-active --quiet \
            xautusd-bot.service; then

            echo "XAUTUSD_BOT_ACTIVE"

          else

            echo "XAUTUSD_BOT_FAILED"

            echo

            sudo systemctl --no-pager status \
              xautusd-bot.service \
              || true

            echo

            sudo journalctl \
              -u xautusd-bot.service \
              -n 80 \
              --no-pager

            exit 1

          fi


          EOF


      # =====================================================
      # VERIFY DASHBOARD
      # =====================================================

      - name: Verify Dashboard
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}

        run: |

          set -e


          ssh \
            -i ~/.ssh/oracle.key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=15 \
            -o ConnectionAttempts=1 \
            -o ServerAliveInterval=10 \
            -o ServerAliveCountMax=2 \
            "$ORACLE_USER@$ORACLE_HOST" << 'EOF'


          set -e


          echo "========================================"

          echo "VERIFYING DASHBOARD"

          echo "========================================"


          echo

          echo "===== PORT 8000 ====="


          if ss -lnt | grep -q ':8000'; then

            echo "DASHBOARD_PORT_8000_OK"

          else

            echo "DASHBOARD_PORT_8000_FAILED"

            echo

            sudo journalctl \
              -u xautusd-bot.service \
              -n 80 \
              --no-pager

            exit 1

          fi


          echo

          echo "===== HEALTH ====="


          curl \
            --max-time 15 \
            -fsS \
            http://127.0.0.1:8000/api/health


          echo


          echo

          echo "===== DASHBOARD DATA ====="


          curl \
            --max-time 15 \
            -fsS \
            http://127.0.0.1:8000/api/dashboard


          echo


          echo

          echo "===== DASHBOARD PAGE ====="


          curl \
            --max-time 15 \
            -fsS \
            http://127.0.0.1:8000/ \
            > /dev/null


          echo "DASHBOARD_PAGE_OK"


          EOF


      # =====================================================
      # CLOUDFLARE
      #
      # Persistent systemd service.
      #
      # This is independent from the GitHub SSH session.
      # =====================================================

      - name: Install Persistent Cloudflare Tunnel
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}

        run: |

          set -e


          ssh \
            -i ~/.ssh/oracle.key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=15 \
            -o ConnectionAttempts=1 \
            -o ServerAliveInterval=10 \
            -o ServerAliveCountMax=2 \
            "$ORACLE_USER@$ORACLE_HOST" << 'EOF'


          set -e


          BOT_DIR="/home/opc/xautusd-bot"

          SERVICE_FILE="/etc/systemd/system/xautusd-cloudflared.service"

          LOG_FILE="$BOT_DIR/cloudflared.log"

          URL_FILE="$BOT_DIR/dashboard-url.txt"

          PID_FILE="$BOT_DIR/quick-tunnel.pid"


          echo "========================================"

          echo "CONFIGURING CLOUDFLARE"

          echo "========================================"


          CLOUDFLARED=$(command -v cloudflared || true)


          if [ -z "$CLOUDFLARED" ]; then

            echo "ERROR: cloudflared not installed"

            exit 1

          fi


          echo "cloudflared: $CLOUDFLARED"


          # -------------------------------------------------
          # Stop previous manual tunnel if present.
          # -------------------------------------------------

          if [ -f "$PID_FILE" ]; then

            OLD_PID=$(cat \
              "$PID_FILE" \
              2>/dev/null \
              || true)


            if [ -n "$OLD_PID" ] && \
               kill -0 "$OLD_PID" 2>/dev/null; then

              kill "$OLD_PID" \
                2>/dev/null \
                || true

              sleep 2

            fi

          fi


          rm -f "$PID_FILE"


          # -------------------------------------------------
          # Stop existing systemd tunnel.
          # -------------------------------------------------

          sudo systemctl stop \
            xautusd-cloudflared.service \
            2>/dev/null \
            || true


          # -------------------------------------------------
          # Create persistent systemd service.
          # -------------------------------------------------

          sudo tee "$SERVICE_FILE" > /dev/null << EOF_SERVICE

          [Unit]

          Description=XAUTUSD Dashboard Cloudflare Quick Tunnel

          After=network-online.target xautusd-bot.service

          Wants=network-online.target


          [Service]

          Type=simple

          User=opc

          WorkingDirectory=$BOT_DIR

          ExecStart=$CLOUDFLARED tunnel --no-autoupdate --url http://127.0.0.1:8000 --logfile $LOG_FILE

          Restart=always

          RestartSec=5

          KillMode=mixed

          TimeoutStopSec=20


          [Install]

          WantedBy=multi-user.target

          EOF_SERVICE


          sudo systemctl daemon-reload


          sudo systemctl enable \
            xautusd-cloudflared.service


          sudo systemctl restart \
            xautusd-cloudflared.service


          echo

          echo "Waiting for tunnel URL..."


          URL=""


          for i in $(seq 1 45); do

            sleep 2


            URL=$(grep -oE \
              'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' \
              "$LOG_FILE" \
              | tail -n 1 \
              || true)


            if [ -n "$URL" ]; then

              break

            fi

          done


          echo

          echo "===== CLOUDFLARE SERVICE ====="


          if sudo systemctl is-active --quiet \
            xautusd-cloudflared.service; then

            echo "CLOUDFLARE_TUNNEL_ACTIVE"

          else

            echo "CLOUDFLARE_TUNNEL_FAILED"

            sudo systemctl --no-pager status \
              xautusd-cloudflared.service \
              || true

            echo

            tail -n 100 \
              "$LOG_FILE" \
              || true

            exit 1

          fi


          if [ -z "$URL" ]; then

            echo

            echo "ERROR: Cloudflare URL not found."

            echo

            tail -n 100 \
              "$LOG_FILE" \
              || true

            exit 1

          fi


          printf '%s\n' "$URL" \
            > "$URL_FILE"


          chmod 600 \
            "$URL_FILE"


          echo

          echo "========================================"

          echo "DASHBOARD URL"

          echo "$URL"

          echo "========================================"


          EOF


      # =====================================================
      # FINAL VERIFICATION
      # =====================================================

      - name: Final Verification
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}

        run: |

          set -e


          ssh \
            -i ~/.ssh/oracle.key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=15 \
            -o ConnectionAttempts=1 \
            -o ServerAliveInterval=10 \
            -o ServerAliveCountMax=2 \
            "$ORACLE_USER@$ORACLE_HOST" << 'EOF'


          set -e


          BOT_DIR="/home/opc/xautusd-bot"

          URL_FILE="$BOT_DIR/dashboard-url.txt"


          echo "========================================"

          echo "FINAL DEPLOYMENT VERIFICATION"

          echo "========================================"


          echo

          echo "===== BOT ====="


          sudo systemctl is-active \
            xautusd-bot.service


          echo

          echo "===== DASHBOARD ====="


          curl \
            --max-time 15 \
            -fsS \
            http://127.0.0.1:8000/api/health


          echo


          echo

          echo "===== CLOUDFLARE ====="


          sudo systemctl is-active \
            xautusd-cloudflared.service


          echo

          echo "===== CLOUDFLARE ENABLED ====="


          sudo systemctl is-enabled \
            xautusd-cloudflared.service


          echo

          echo "===== DASHBOARD URL ====="


          if [ -f "$URL_FILE" ]; then

            cat "$URL_FILE"

          else

            echo "URL FILE NOT FOUND"

            exit 1

          fi


          echo

          echo

          echo "========================================"

          echo "DEPLOYMENT SUCCESS"

          echo "========================================"


          EOF
