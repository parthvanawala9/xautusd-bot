name: Deploy XAUTUSD Bot + Dashboard

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read


jobs:

  deploy:

    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # CHECKOUT
      # =====================================================

      - name: Checkout
        uses: actions/checkout@v4


      # =====================================================
      # PREPARE SSH
      # =====================================================

      - name: Prepare SSH
        env:
          ORACLE_PRIVATE_KEY: ${{ secrets.ORACLE_PRIVATE_KEY }}

        run: |

          set -e

          mkdir -p ~/.ssh

          printf '%s\n' "$ORACLE_PRIVATE_KEY" \
            > ~/.ssh/oracle.key

          chmod 600 ~/.ssh/oracle.key

          ssh-keygen \
            -y \
            -f ~/.ssh/oracle.key \
            > /dev/null

          echo "SSH KEY OK"


      # =====================================================
      # CHECK BOT SYNTAX
      # =====================================================

      - name: Check bot.py Syntax
        run: |

          set -e

          python3 -m py_compile bot.py

          echo "BOT_PY_SYNTAX_OK"


      # =====================================================
      # SSH CONFIGURATION
      # =====================================================

      - name: Configure SSH
        run: |

          set -e

          cat > ~/.ssh/config << 'EOF'

          Host oracle-xautusd

              HostName PLACEHOLDER_ORACLE_HOST

              User PLACEHOLDER_ORACLE_USER

              IdentityFile ~/.ssh/oracle.key

              BatchMode yes

              StrictHostKeyChecking no

              UserKnownHostsFile /dev/null

              ConnectTimeout 30

              ConnectionAttempts 1

              ServerAliveInterval 10

              ServerAliveCountMax 3

              TCPKeepAlive yes

              IPQoS throughput

              GSSAPIAuthentication no

              PreferredAuthentications publickey

              PubkeyAuthentication yes

              IdentitiesOnly yes

              AddressFamily inet

          EOF


          echo "SSH CONFIG CREATED"


      # =====================================================
      # TEST ORACLE SSH
      # =====================================================

      - name: Test Oracle SSH
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}

        run: |

          set -e

          echo "========================================"
          echo "TESTING ORACLE SSH"
          echo "========================================"

          timeout 90 ssh \
            -4 \
            -i ~/.ssh/oracle.key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=30 \
            -o ConnectionAttempts=1 \
            -o ServerAliveInterval=10 \
            -o ServerAliveCountMax=3 \
            -o TCPKeepAlive=yes \
            -o IPQoS=throughput \
            -o GSSAPIAuthentication=no \
            -o PreferredAuthentications=publickey \
            -o PubkeyAuthentication=yes \
            -o IdentitiesOnly=yes \
            -o AddressFamily=inet \
            "$ORACLE_USER@$ORACLE_HOST" \
            "echo ORACLE_SSH_OK"

          echo
          echo "========================================"
          echo "ORACLE_SSH_OK"
          echo "========================================"


      # =====================================================
      # PREPARE ORACLE DEPLOYMENT DIRECTORY
      # =====================================================

      - name: Prepare Oracle Deployment Directory
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}

        run: |

          set -e

          timeout 90 ssh \
            -4 \
            -i ~/.ssh/oracle.key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=30 \
            -o ConnectionAttempts=1 \
            -o ServerAliveInterval=10 \
            -o ServerAliveCountMax=3 \
            -o TCPKeepAlive=yes \
            -o IPQoS=throughput \
            -o GSSAPIAuthentication=no \
            -o PreferredAuthentications=publickey \
            -o PubkeyAuthentication=yes \
            -o IdentitiesOnly=yes \
            -o AddressFamily=inet \
            "$ORACLE_USER@$ORACLE_HOST" \
            "mkdir -p /home/opc/xautusd-bot/.deploy_tmp"

          echo "ORACLE_DEPLOY_DIRECTORY_OK"


      # =====================================================
      # UPLOAD FILES
      # =====================================================

      - name: Upload Bot And Dashboard
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}

        run: |

          set -e

          timeout 120 scp \
            -4 \
            -i ~/.ssh/oracle.key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=30 \
            -o ConnectionAttempts=1 \
            -o ServerAliveInterval=10 \
            -o ServerAliveCountMax=3 \
            -o TCPKeepAlive=yes \
            -o IPQoS=throughput \
            -o GSSAPIAuthentication=no \
            -o PreferredAuthentications=publickey \
            -o PubkeyAuthentication=yes \
            -o IdentitiesOnly=yes \
            -o AddressFamily=inet \
            bot.py \
            index.html \
            app.js \
            style.css \
            "$ORACLE_USER@$ORACLE_HOST:/home/opc/xautusd-bot/.deploy_tmp/"

          echo "UPLOAD_OK"


      # =====================================================
      # VERIFY UPLOADED FILES
      # =====================================================

      - name: Verify Uploaded Files
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}

        run: |

          set -e

          timeout 90 ssh \
            -4 \
            -i ~/.ssh/oracle.key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=30 \
            -o ConnectionAttempts=1 \
            -o ServerAliveInterval=10 \
            -o ServerAliveCountMax=3 \
            -o TCPKeepAlive=yes \
            -o IPQoS=throughput \
            -o GSSAPIAuthentication=no \
            -o PreferredAuthentications=publickey \
            -o PubkeyAuthentication=yes \
            -o IdentitiesOnly=yes \
            -o AddressFamily=inet \
            "$ORACLE_USER@$ORACLE_HOST" << 'EOF'

          set -e

          BOT_DIR="/home/opc/xautusd-bot"
          TMP_DIR="$BOT_DIR/.deploy_tmp"

          test -f "$TMP_DIR/bot.py"
          test -f "$TMP_DIR/index.html"
          test -f "$TMP_DIR/app.js"
          test -f "$TMP_DIR/style.css"

          python3 -m py_compile "$TMP_DIR/bot.py"

          echo "ALL_UPLOADS_PRESENT"
          echo "UPLOADED_BOT_SYNTAX_OK"

          EOF


      # =====================================================
      # INSTALL FILES
      # =====================================================

      - name: Install New Files
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}

        run: |

          set -e

          timeout 120 ssh \
            -4 \
            -i ~/.ssh/oracle.key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=30 \
            -o ConnectionAttempts=1 \
            -o ServerAliveInterval=10 \
            -o ServerAliveCountMax=3 \
            -o TCPKeepAlive=yes \
            -o IPQoS=throughput \
            -o GSSAPIAuthentication=no \
            -o PreferredAuthentications=publickey \
            -o PubkeyAuthentication=yes \
            -o IdentitiesOnly=yes \
            -o AddressFamily=inet \
            "$ORACLE_USER@$ORACLE_HOST" << 'EOF'

          set -e

          BOT_DIR="/home/opc/xautusd-bot"
          TMP_DIR="$BOT_DIR/.deploy_tmp"

          test -f "$TMP_DIR/bot.py"
          test -f "$TMP_DIR/index.html"
          test -f "$TMP_DIR/app.js"
          test -f "$TMP_DIR/style.css"

          python3 -m py_compile "$TMP_DIR/bot.py"

          cp "$TMP_DIR/bot.py" "$BOT_DIR/bot.py"
          cp "$TMP_DIR/index.html" "$BOT_DIR/index.html"
          cp "$TMP_DIR/app.js" "$BOT_DIR/app.js"
          cp "$TMP_DIR/style.css" "$BOT_DIR/style.css"

          rm -rf "$TMP_DIR"

          echo "FILES_INSTALLED_OK"

          EOF


      # =====================================================
      # RESTART BOT
      # =====================================================

      - name: Restart XAUTUSD Bot
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}

        run: |

          set -e

          timeout 120 ssh \
            -4 \
            -i ~/.ssh/oracle.key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=30 \
            -o ConnectionAttempts=1 \
            -o ServerAliveInterval=10 \
            -o ServerAliveCountMax=3 \
            -o TCPKeepAlive=yes \
            -o IPQoS=throughput \
            -o GSSAPIAuthentication=no \
            -o PreferredAuthentications=publickey \
            -o PubkeyAuthentication=yes \
            -o IdentitiesOnly=yes \
            -o AddressFamily=inet \
            "$ORACLE_USER@$ORACLE_HOST" << 'EOF'

          set -e

          sudo systemctl restart xautusd-bot.service

          sleep 10

          if sudo systemctl is-active --quiet xautusd-bot.service; then

            echo "XAUTUSD_BOT_ACTIVE"

          else

            echo "XAUTUSD_BOT_FAILED"

            sudo systemctl --no-pager status \
              xautusd-bot.service \
              || true

            sudo journalctl \
              -u xautusd-bot.service \
              -n 100 \
              --no-pager

            exit 1

          fi

          EOF


      # =====================================================
      # VERIFY DASHBOARD
      # =====================================================

      - name: Verify Dashboard
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}

        run: |

          set -e

          timeout 120 ssh \
            -4 \
            -i ~/.ssh/oracle.key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=30 \
            -o ConnectionAttempts=1 \
            -o ServerAliveInterval=10 \
            -o ServerAliveCountMax=3 \
            -o TCPKeepAlive=yes \
            -o IPQoS=throughput \
            -o GSSAPIAuthentication=no \
            -o PreferredAuthentications=publickey \
            -o PubkeyAuthentication=yes \
            -o IdentitiesOnly=yes \
            -o AddressFamily=inet \
            "$ORACLE_USER@$ORACLE_HOST" << 'EOF'

          set -e

          echo "===== PORT 8000 ====="

          ss -lnt | grep -q ':8000'

          echo "DASHBOARD_PORT_8000_OK"

          echo "===== HEALTH ====="

          curl \
            --max-time 20 \
            -fsS \
            http://127.0.0.1:8000/api/health

          echo

          echo "===== DASHBOARD DATA ====="

          curl \
            --max-time 20 \
            -fsS \
            http://127.0.0.1:8000/api/dashboard

          echo

          echo "===== DASHBOARD PAGE ====="

          curl \
            --max-time 20 \
            -fsS \
            http://127.0.0.1:8000/ \
            > /dev/null

          echo "DASHBOARD_PAGE_OK"

          EOF


      # =====================================================
      # INSTALL PERSISTENT CLOUDFLARE TUNNEL
      # =====================================================

      - name: Install Persistent Cloudflare Tunnel
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}

        run: |

          set -e

          timeout 150 ssh \
            -4 \
            -i ~/.ssh/oracle.key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=30 \
            -o ConnectionAttempts=1 \
            -o ServerAliveInterval=10 \
            -o ServerAliveCountMax=3 \
            -o TCPKeepAlive=yes \
            -o IPQoS=throughput \
            -o GSSAPIAuthentication=no \
            -o PreferredAuthentications=publickey \
            -o PubkeyAuthentication=yes \
            -o IdentitiesOnly=yes \
            -o AddressFamily=inet \
            "$ORACLE_USER@$ORACLE_HOST" << 'EOF'

          set -e

          BOT_DIR="/home/opc/xautusd-bot"

          SERVICE_FILE="/etc/systemd/system/xautusd-cloudflared.service"
          LOG_FILE="$BOT_DIR/cloudflared.log"
          URL_FILE="$BOT_DIR/dashboard-url.txt"

          CLOUDFLARED=$(command -v cloudflared || true)

          if [ -z "$CLOUDFLARED" ]; then
            echo "ERROR: cloudflared not installed"
            exit 1
          fi

          sudo systemctl stop \
            xautusd-cloudflared.service \
            2>/dev/null \
            || true

          sudo tee "$SERVICE_FILE" > /dev/null << EOF_SERVICE
          [Unit]
          Description=XAUTUSD Dashboard Cloudflare Quick Tunnel
          After=network-online.target xautusd-bot.service
          Wants=network-online.target

          [Service]
          Type=simple
          User=opc
          WorkingDirectory=$BOT_DIR
          ExecStart=$CLOUDFLARED tunnel --no-autoupdate --url http://127.0.0.1:8000 --logfile $LOG_FILE
          Restart=always
          RestartSec=5
          KillMode=mixed
          TimeoutStopSec=20

          [Install]
          WantedBy=multi-user.target
          EOF_SERVICE

          sudo systemctl daemon-reload

          sudo systemctl enable \
            xautusd-cloudflared.service

          sudo systemctl restart \
            xautusd-cloudflared.service

          URL=""

          for i in $(seq 1 45); do

            sleep 2

            URL=$(grep -oE \
              'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' \
              "$LOG_FILE" \
              | tail -n 1 \
              || true)

            if [ -n "$URL" ]; then
              break
            fi

          done

          if ! sudo systemctl is-active --quiet \
            xautusd-cloudflared.service; then

            sudo systemctl --no-pager status \
              xautusd-cloudflared.service \
              || true

            tail -n 100 "$LOG_FILE" || true

            exit 1

          fi

          if [ -z "$URL" ]; then

            echo "ERROR: Cloudflare URL not found."

            tail -n 100 "$LOG_FILE" || true

            exit 1

          fi

          printf '%s\n' "$URL" > "$URL_FILE"

          chmod 600 "$URL_FILE"

          echo
          echo "========================================"
          echo "DASHBOARD URL"
          echo "$URL"
          echo "========================================"

          EOF


      # =====================================================
      # FINAL VERIFICATION
      # =====================================================

      - name: Final Verification
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}

        run: |

          set -e

          timeout 150 ssh \
            -4 \
            -i ~/.ssh/oracle.key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=30 \
            -o ConnectionAttempts=1 \
            -o ServerAliveInterval=10 \
            -o ServerAliveCountMax=3 \
            -o TCPKeepAlive=yes \
            -o IPQoS=throughput \
            -o GSSAPIAuthentication=no \
            -o PreferredAuthentications=publickey \
            -o PubkeyAuthentication=yes \
            -o IdentitiesOnly=yes \
            -o AddressFamily=inet \
            "$ORACLE_USER@$ORACLE_HOST" << 'EOF'

          set -e

          BOT_DIR="/home/opc/xautusd-bot"
          URL_FILE="$BOT_DIR/dashboard-url.txt"

          echo "========================================"
          echo "FINAL DEPLOYMENT VERIFICATION"
          echo "========================================"

          echo
          echo "===== BOT ====="

          if sudo systemctl is-active --quiet \
            xautusd-bot.service; then

            echo "BOT_ACTIVE"

          else

            echo "BOT_FAILED"

            sudo journalctl \
              -u xautusd-bot.service \
              -n 100 \
              --no-pager

            exit 1

          fi

          echo
          echo "===== DASHBOARD ====="

          curl \
            --max-time 20 \
            -fsS \
            http://127.0.0.1:8000/api/health

          echo

          echo
          echo "===== DASHBOARD DATA ====="

          curl \
            --max-time 20 \
            -fsS \
            http://127.0.0.1:8000/api/dashboard

          echo

          echo
          echo "===== CLOUDFLARE ====="

          if sudo systemctl is-active --quiet \
            xautusd-cloudflared.service; then

            echo "CLOUDFLARE_TUNNEL_ACTIVE"

          else

            echo "CLOUDFLARE_TUNNEL_FAILED"

            sudo systemctl --no-pager status \
              xautusd-cloudflared.service \
              || true

            exit 1

          fi

          echo
          echo "===== CLOUDFLARE ENABLED ====="

          sudo systemctl is-enabled \
            xautusd-cloudflared.service

          echo
          echo "===== DASHBOARD URL ====="

          if [ -f "$URL_FILE" ]; then

            cat "$URL_FILE"

          else

            echo "URL FILE NOT FOUND"

            exit 1

          fi

          echo
          echo
          echo "========================================"
          echo "DEPLOYMENT SUCCESS"
          echo "========================================"

          EOF
