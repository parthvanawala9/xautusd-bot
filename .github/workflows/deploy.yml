name: Deploy XAUTUSD Bot + Dashboard

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read


jobs:

  deploy:

    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # CHECKOUT
      # =====================================================

      - name: Checkout
        uses: actions/checkout@v4


      # =====================================================
      # PREPARE SSH
      # =====================================================

      - name: Prepare SSH
        env:
          ORACLE_PRIVATE_KEY: ${{ secrets.ORACLE_PRIVATE_KEY }}

        run: |

          set -e

          mkdir -p ~/.ssh

          printf '%s\n' "$ORACLE_PRIVATE_KEY" \
            > ~/.ssh/oracle.key

          chmod 600 ~/.ssh/oracle.key

          ssh-keygen \
            -y \
            -f ~/.ssh/oracle.key \
            > /dev/null

          echo "SSH KEY OK"


      # =====================================================
      # CHECK BOT PYTHON SYNTAX
      #
      # This happens BEFORE touching Oracle.
      # =====================================================

      - name: Check bot.py Syntax
        run: |

          set -e

          python3 -m py_compile bot.py

          echo "BOT_PY_SYNTAX_OK"


      # =====================================================
      # UPLOAD BOT + DASHBOARD FILES
      #
      # Upload goes to temporary directory first.
      #
      # Existing running application is not touched
      # until upload is completely successful.
      # =====================================================

      - name: Upload Bot And Dashboard
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}

        run: |

          set -e

          echo "========================================"
          echo "CONNECTING TO ORACLE"
          echo "========================================"


          echo
          echo "Testing Oracle SSH..."


          ssh \
            -i ~/.ssh/oracle.key \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=60 \
            -o ConnectionAttempts=5 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4 \
            "$ORACLE_USER@$ORACLE_HOST" \
            "echo ORACLE_SSH_OK"


          echo
          echo "Creating temporary deployment directory..."


          ssh \
            -i ~/.ssh/oracle.key \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=60 \
            -o ConnectionAttempts=5 \
            "$ORACLE_USER@$ORACLE_HOST" \
            "mkdir -p /home/opc/xautusd-bot/.deploy_tmp"


          echo
          echo "Uploading files..."


          scp \
            -i ~/.ssh/oracle.key \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=60 \
            -o ConnectionAttempts=5 \
            bot.py \
            index.html \
            app.js \
            style.css \
            "$ORACLE_USER@$ORACLE_HOST:/home/opc/xautusd-bot/.deploy_tmp/"


          echo
          echo "UPLOAD_OK"


      # =====================================================
      # INSTALL NEW FILES
      #
      # IMPORTANT:
      # accounts.json
      # account_states/
      # account_history/
      #
      # are NOT touched.
      # =====================================================

      - name: Install New Files
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}

        run: |

          set -e

          ssh \
            -i ~/.ssh/oracle.key \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=60 \
            -o ConnectionAttempts=5 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4 \
            "$ORACLE_USER@$ORACLE_HOST" << 'EOF'

          set -e


          BOT_DIR="/home/opc/xautusd-bot"

          TMP_DIR="$BOT_DIR/.deploy_tmp"


          echo "========================================"
          echo "INSTALLING NEW FILES"
          echo "========================================"


          test -f "$TMP_DIR/bot.py"

          test -f "$TMP_DIR/index.html"

          test -f "$TMP_DIR/app.js"

          test -f "$TMP_DIR/style.css"


          echo
          echo "Uploaded files verified."


          echo
          echo "Checking Python syntax on Oracle..."


          python3 -m py_compile \
            "$TMP_DIR/bot.py"


          echo "ORACLE_BOT_SYNTAX_OK"


          echo
          echo "Replacing application files..."


          cp \
            "$TMP_DIR/bot.py" \
            "$BOT_DIR/bot.py"


          cp \
            "$TMP_DIR/index.html" \
            "$BOT_DIR/index.html"


          cp \
            "$TMP_DIR/app.js" \
            "$BOT_DIR/app.js"


          cp \
            "$TMP_DIR/style.css" \
            "$BOT_DIR/style.css"


          rm -rf \
            "$TMP_DIR"


          echo
          echo "FILES_INSTALLED_OK"


          EOF


      # =====================================================
      # RESTART BOT + DASHBOARD
      #
      # bot.py starts the dashboard on port 8000.
      # =====================================================

      - name: Restart XAUTUSD Bot
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}

        run: |

          set -e

          ssh \
            -i ~/.ssh/oracle.key \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=60 \
            -o ConnectionAttempts=5 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4 \
            "$ORACLE_USER@$ORACLE_HOST" << 'EOF'


          set -e


          echo "========================================"

          echo "RESTART XAUTUSD BOT + DASHBOARD"

          echo "========================================"


          sudo systemctl restart \
            xautusd-bot.service


          echo

          echo "Waiting for service startup..."


          sleep 10


          echo

          echo "===== SERVICE STATUS ====="


          sudo systemctl --no-pager status \
            xautusd-bot.service || true


          EOF


      # =====================================================
      # VERIFY BOT
      # =====================================================

      - name: Verify XAUTUSD Bot
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}

        run: |

          set -e

          ssh \
            -i ~/.ssh/oracle.key \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=60 \
            -o ConnectionAttempts=5 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4 \
            "$ORACLE_USER@$ORACLE_HOST" << 'EOF'


          echo "========================================"

          echo "BOT VERIFICATION"

          echo "========================================"


          if sudo systemctl is-active --quiet \
            xautusd-bot.service; then


            echo "XAUTUSD_BOT_ACTIVE"


          else


            echo "XAUTUSD_BOT_FAILED"


            echo

            echo "===== SERVICE STATUS ====="


            sudo systemctl --no-pager status \
              xautusd-bot.service || true


            echo

            echo "===== RECENT BOT LOGS ====="


            sudo journalctl \
              -u xautusd-bot.service \
              -n 80 \
              --no-pager


            exit 1


          fi


          echo

          echo "===== BOT PROCESS ====="


          pgrep -af \
            "/home/opc/xautusd-bot/bot.py" \
            || true


          echo

          echo "===== RECENT BOT LOGS ====="


          sudo journalctl \
            -u xautusd-bot.service \
            -n 40 \
            --no-pager


          EOF


      # =====================================================
      # VERIFY DASHBOARD
      # =====================================================

      - name: Verify Dashboard
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}

        run: |

          set -e

          ssh \
            -i ~/.ssh/oracle.key \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=60 \
            -o ConnectionAttempts=5 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4 \
            "$ORACLE_USER@$ORACLE_HOST" << 'EOF'


          set -e


          echo "========================================"

          echo "DASHBOARD VERIFICATION"

          echo "========================================"


          echo

          echo "===== PORT 8000 ====="


          if ss -lnt | grep -q ':8000'; then


            echo "DASHBOARD_PORT_8000_OK"


          else


            echo "DASHBOARD_PORT_8000_FAILED"


            echo

            echo "===== BOT LOGS ====="


            sudo journalctl \
              -u xautusd-bot.service \
              -n 80 \
              --no-pager


            exit 1


          fi


          echo

          echo "===== LOCAL HEALTH ====="


          curl \
            --max-time 20 \
            -fsS \
            http://127.0.0.1:8000/api/health


          echo


          echo

          echo "===== LOCAL DASHBOARD DATA ====="


          curl \
            --max-time 20 \
            -fsS \
            http://127.0.0.1:8000/api/dashboard


          echo


          echo

          echo "===== LOCAL DASHBOARD PAGE ====="


          curl \
            --max-time 20 \
            -fsS \
            http://127.0.0.1:8000/ \
            > /dev/null


          echo "DASHBOARD_PAGE_OK"


          EOF


      # =====================================================
      # CLOUDFLARE QUICK TUNNEL
      #
      # FIX:
      #
      # The old workflow used:
      #
      #   nohup cloudflared tunnel ...
      #
      # That process could disappear after the GitHub SSH
      # session ended.
      #
      # We now install a SYSTEMD service for cloudflared.
      #
      # systemd will:
      #
      # 1. Keep tunnel alive
      # 2. Restart tunnel if it crashes
      # 3. Start tunnel after Oracle reboot
      # 4. Keep tunnel independent from GitHub Actions
      #
      # The existing bot service is NOT replaced.
      # =====================================================

      - name: Install Persistent Cloudflare Tunnel
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}

        run: |

          set -e


          ssh \
            -i ~/.ssh/oracle.key \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=60 \
            -o ConnectionAttempts=5 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4 \
            "$ORACLE_USER@$ORACLE_HOST" << 'EOF'


          set -e


          BOT_DIR="/home/opc/xautusd-bot"

          SERVICE_FILE="/etc/systemd/system/xautusd-cloudflared.service"

          URL_FILE="$BOT_DIR/dashboard-url.txt"

          LOG_FILE="$BOT_DIR/cloudflared.log"


          echo "========================================"

          echo "CONFIGURING CLOUDFLARE TUNNEL"

          echo "========================================"


          CLOUDFLARED=$(command -v cloudflared || true)


          if [ -z "$CLOUDFLARED" ]; then

            echo "ERROR: cloudflared is not installed."

            exit 1

          fi


          echo

          echo "cloudflared path: $CLOUDFLARED"


          # -------------------------------------------------
          # Stop old manual Quick Tunnel if one exists.
          # -------------------------------------------------

          PID_FILE="$BOT_DIR/quick-tunnel.pid"


          if [ -f "$PID_FILE" ]; then

            OLD_PID=$(cat \
              "$PID_FILE" \
              2>/dev/null \
              || true)


            if [ -n "$OLD_PID" ] && \
               kill -0 "$OLD_PID" 2>/dev/null; then

              echo "Stopping old Quick Tunnel PID $OLD_PID"

              kill "$OLD_PID" \
                2>/dev/null \
                || true

              sleep 3

            fi

          fi


          rm -f "$PID_FILE"


          # -------------------------------------------------
          # Stop any old cloudflared process that is NOT
          # managed by our new systemd service.
          # -------------------------------------------------

          sudo systemctl stop \
            xautusd-cloudflared.service \
            2>/dev/null \
            || true


          # -------------------------------------------------
          # Create persistent systemd service.
          # -------------------------------------------------

          echo

          echo "Creating systemd Cloudflare service..."


          sudo tee "$SERVICE_FILE" > /dev/null << EOF_SERVICE

          [Unit]

          Description=XAUTUSD Dashboard Cloudflare Quick Tunnel

          After=network-online.target xautusd-bot.service

          Wants=network-online.target


          [Service]

          Type=simple

          User=opc

          WorkingDirectory=$BOT_DIR

          ExecStart=$CLOUDFLARED tunnel --no-autoupdate --url http://127.0.0.1:8000 --logfile $LOG_FILE

          Restart=always

          RestartSec=5

          KillMode=mixed

          TimeoutStopSec=20


          [Install]

          WantedBy=multi-user.target

          EOF_SERVICE


          echo

          echo "SYSTEMD_SERVICE_CREATED"


          # -------------------------------------------------
          # Reload systemd.
          # -------------------------------------------------

          sudo systemctl daemon-reload


          # -------------------------------------------------
          # Enable tunnel on Oracle boot.
          # -------------------------------------------------

          sudo systemctl enable \
            xautusd-cloudflared.service


          # -------------------------------------------------
          # Start persistent tunnel.
          # -------------------------------------------------

          sudo systemctl restart \
            xautusd-cloudflared.service


          echo

          echo "Waiting for Cloudflare tunnel..."


          URL=""


          for i in $(seq 1 45); do

            sleep 2


            URL=$(grep -oE \
              'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' \
              "$LOG_FILE" \
              | tail -n 1 \
              || true)


            if [ -n "$URL" ]; then

              break

            fi

          done


          # -------------------------------------------------
          # Verify systemd service.
          # -------------------------------------------------

          echo

          echo "===== CLOUDFLARE SERVICE STATUS ====="


          if sudo systemctl is-active --quiet \
            xautusd-cloudflared.service; then

            echo "CLOUDFLARE_TUNNEL_ACTIVE"

          else

            echo "CLOUDFLARE_TUNNEL_FAILED"

            echo

            sudo systemctl --no-pager status \
              xautusd-cloudflared.service \
              || true

            echo

            echo "===== CLOUDFLARED LOG ====="

            tail -n 100 \
              "$LOG_FILE" \
              || true

            exit 1

          fi


          # -------------------------------------------------
          # Verify URL.
          # -------------------------------------------------

          if [ -z "$URL" ]; then

            echo

            echo "ERROR: Cloudflare URL was not found."

            echo

            echo "===== CLOUDFLARED LOG ====="

            tail -n 100 \
              "$LOG_FILE" \
              || true

            exit 1

          fi


          # -------------------------------------------------
          # Save URL.
          # -------------------------------------------------

          printf '%s\n' "$URL" \
            > "$URL_FILE"


          chmod 600 \
            "$URL_FILE"


          echo

          echo "========================================"

          echo "CLOUDFLARE TUNNEL ACTIVE"

          echo "========================================"


          echo

          echo "DASHBOARD URL"

          echo "$URL"


          echo

          echo "URL SAVED TO"

          echo "$URL_FILE"


          echo

          echo "TUNNEL SERVICE"

          echo "xautusd-cloudflared.service"


          echo

          echo "========================================"

          echo "PERSISTENT TUNNEL CONFIGURED"

          echo "========================================"


          EOF


      # =====================================================
      # FINAL CLOUDFLARE VERIFICATION
      #
      # This verifies the service itself, not just the URL.
      # =====================================================

      - name: Verify Cloudflare Tunnel
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}

        run: |

          set -e


          ssh \
            -i ~/.ssh/oracle.key \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=60 \
            -o ConnectionAttempts=5 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4 \
            "$ORACLE_USER@$ORACLE_HOST" << 'EOF'


          set -e


          BOT_DIR="/home/opc/xautusd-bot"

          URL_FILE="$BOT_DIR/dashboard-url.txt"


          echo "========================================"

          echo "FINAL CLOUDFLARE VERIFICATION"

          echo "========================================"


          echo

          echo "===== SERVICE ====="


          sudo systemctl is-active \
            xautusd-cloudflared.service


          echo

          echo "===== ENABLED ====="


          sudo systemctl is-enabled \
            xautusd-cloudflared.service


          echo

          echo "===== DASHBOARD URL ====="


          if [ -f "$URL_FILE" ]; then

            cat "$URL_FILE"

          else

            echo "URL FILE NOT FOUND"

            exit 1

          fi


          echo

          echo

          echo "===== CLOUDFLARE SERVICE STATUS ====="


          sudo systemctl --no-pager status \
            xautusd-cloudflared.service \
            || true


          echo

          echo "========================================"

          echo "DEPLOYMENT SUCCESS"

          echo "========================================"


          EOF
