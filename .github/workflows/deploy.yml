name: Dashboard Engine & Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare SSH
        env:
          ORACLE_PRIVATE_KEY: ${{ secrets.ORACLE_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$ORACLE_PRIVATE_KEY" > ~/.ssh/oracle.key
          chmod 600 ~/.ssh/oracle.key

      - name: Test Oracle SSH
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
        run: |
          ssh \
            -i ~/.ssh/oracle.key \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=15 \
            -o ConnectionAttempts=1 \
            -o ServerAliveInterval=10 \
            -o ServerAliveCountMax=3 \
            "$ORACLE_USER@$ORACLE_HOST" \
            "echo ORACLE_SSH_OK"

      - name: Copy Dashboard API
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
        run: |
          ssh \
            -i ~/.ssh/oracle.key \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=15 \
            -o ConnectionAttempts=1 \
            -o ServerAliveInterval=10 \
            -o ServerAliveCountMax=3 \
            "$ORACLE_USER@$ORACLE_HOST" \
            "mkdir -p /home/opc/xautusd-bot/dashboard"

          scp \
            -i ~/.ssh/oracle.key \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=15 \
            -o ConnectionAttempts=1 \
            -o ServerAliveInterval=10 \
            -o ServerAliveCountMax=3 \
            dashboard_api.py \
            "$ORACLE_USER@$ORACLE_HOST:/home/opc/xautusd-bot/dashboard/dashboard_api.py"

      - name: Restart Dashboard API
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
        run: |
          ssh \
            -i ~/.ssh/oracle.key \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=15 \
            -o ConnectionAttempts=1 \
            -o ServerAliveInterval=10 \
            -o ServerAliveCountMax=3 \
            "$ORACLE_USER@$ORACLE_HOST" << 'EOF'

          cd /home/opc/xautusd-bot

          python3 -m pip install --user flask flask-cors requests python-dotenv

          pkill -f "dashboard/dashboard_api.py" || true

          sleep 2

          nohup python3 \
            /home/opc/xautusd-bot/dashboard/dashboard_api.py \
            > /home/opc/xautusd-bot/dashboard/dashboard.log 2>&1 &

          sleep 5

          echo "===== DASHBOARD PROCESS ====="
          pgrep -af "dashboard/dashboard_api.py" || true

          echo "===== PORT 8000 ====="
          ss -lntp | grep ':8000' || true

          echo "===== HEALTH ====="
          curl --max-time 15 -fsS \
            http://127.0.0.1:8000/api/health

          echo

          echo "===== DASHBOARD ====="
          curl --max-time 15 -fsS \
            http://127.0.0.1:8000/api/dashboard

          echo

          EOF

      - name: Start Cloudflare Quick Tunnel
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
        run: |
          ssh \
            -i ~/.ssh/oracle.key \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=15 \
            -o ConnectionAttempts=1 \
            -o ServerAliveInterval=10 \
            -o ServerAliveCountMax=3 \
            "$ORACLE_USER@$ORACLE_HOST" << 'EOF'

          CLOUDFLARED=$(command -v cloudflared || true)

          if [ -z "$CLOUDFLARED" ]; then
            echo "ERROR: cloudflared not installed"
            exit 1
          fi

          mkdir -p /home/opc/xautusd-bot/dashboard

          if [ -f /home/opc/xautusd-bot/dashboard/quick-tunnel.pid ]; then
            OLD_PID=$(cat /home/opc/xautusd-bot/dashboard/quick-tunnel.pid 2>/dev/null || true)

            if [ -n "$OLD_PID" ] && kill -0 "$OLD_PID" 2>/dev/null; then
              kill "$OLD_PID" 2>/dev/null || true
              sleep 2
            fi
          fi

          rm -f /home/opc/xautusd-bot/dashboard/quick-tunnel.pid

          : > /home/opc/xautusd-bot/dashboard/quick-tunnel.log

          nohup "$CLOUDFLARED" tunnel \
            --url http://127.0.0.1:8000 \
            > /home/opc/xautusd-bot/dashboard/quick-tunnel.log 2>&1 &

          TUNNEL_PID=$!

          echo "$TUNNEL_PID" \
            > /home/opc/xautusd-bot/dashboard/quick-tunnel.pid

          echo "Tunnel PID: $TUNNEL_PID"

          URL=""

          for i in $(seq 1 30); do
            sleep 2

            URL=$(grep -oE \
              'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' \
              /home/opc/xautusd-bot/dashboard/quick-tunnel.log \
              | tail -n 1 || true)

            if [ -n "$URL" ]; then
              break
            fi
          done

          if [ -z "$URL" ]; then
            echo "ERROR: Cloudflare URL not found"
            cat /home/opc/xautusd-bot/dashboard/quick-tunnel.log || true
            exit 1
          fi

          echo
          echo "======================================"
          echo "CURRENT DASHBOARD URL"
          echo "$URL"
          echo "======================================"

          echo
          echo "HEALTH:"
          echo "$URL/api/health"

          echo
          echo "DASHBOARD:"
          echo "$URL/api/dashboard"

          echo
          echo "===== REMOTE HEALTH TEST ====="
          curl --max-time 20 -fsS "$URL/api/health"

          echo

          echo
          echo "===== REMOTE DASHBOARD TEST ====="
          curl --max-time 20 -fsS "$URL/api/dashboard"

          echo

          EOF

      - name: Final Verification
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
        run: |
          ssh \
            -i ~/.ssh/oracle.key \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=15 \
            -o ConnectionAttempts=1 \
            -o ServerAliveInterval=10 \
            -o ServerAliveCountMax=3 \
            "$ORACLE_USER@$ORACLE_HOST" << 'EOF'

          echo "===== DASHBOARD API ====="

          pgrep -af "dashboard/dashboard_api.py" || true

          echo
          echo "===== PORT 8000 ====="

          ss -lntp | grep ':8000' || true

          echo
          echo "===== LOCAL HEALTH ====="

          curl --max-time 15 -fsS \
            http://127.0.0.1:8000/api/health

          echo

          echo
          echo "===== DASHBOARD DATA ====="

          curl --max-time 15 -fsS \
            http://127.0.0.1:8000/api/dashboard

          echo

          EOF
