name: XAUTUSD SSH Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ssh-diagnostic:
    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # CHECKOUT
      # =====================================================

      - name: Checkout
        uses: actions/checkout@v4


      # =====================================================
      # PREPARE SSH KEY
      # =====================================================

      - name: Prepare SSH
        env:
          ORACLE_PRIVATE_KEY: ${{ secrets.ORACLE_PRIVATE_KEY }}

        run: |
          set -e

          echo "========================================"
          echo "PREPARING SSH KEY"
          echo "========================================"

          mkdir -p ~/.ssh

          printf '%s\n' "$ORACLE_PRIVATE_KEY" \
            > ~/.ssh/oracle.key

          chmod 600 ~/.ssh/oracle.key

          ssh-keygen \
            -y \
            -f ~/.ssh/oracle.key \
            > ~/.ssh/oracle_public.key

          echo "SSH_KEY_FILE_OK"
          echo "SSH_PRIVATE_KEY_VALID"


      # =====================================================
      # CHECK HOST / PORT
      # =====================================================

      - name: Test Oracle Port 22
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}

        run: |
          set -e

          echo "========================================"
          echo "TESTING ORACLE PORT 22"
          echo "========================================"

          echo "Checking TCP connection..."

          timeout 20 bash -c \
            "cat < /dev/null > /dev/tcp/$ORACLE_HOST/22"

          echo
          echo "ORACLE_PORT_22_REACHABLE"


      # =====================================================
      # SHOW SSH CLIENT VERSION
      # =====================================================

      - name: Check SSH Client
        run: |
          set -e

          echo "========================================"
          echo "SSH CLIENT"
          echo "========================================"

          ssh -V

          echo
          echo "OPENSSH_CLIENT_OK"


      # =====================================================
      # SSH CONFIG TEST
      # =====================================================

      - name: Test SSH Configuration
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}

        run: |
          set -e

          echo "========================================"
          echo "TESTING SSH CONFIGURATION"
          echo "========================================"

          ssh \
            -G \
            -4 \
            -i ~/.ssh/oracle.key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=15 \
            -o ConnectionAttempts=1 \
            -o GSSAPIAuthentication=no \
            -o PreferredAuthentications=publickey \
            -o PubkeyAuthentication=yes \
            -o IdentitiesOnly=yes \
            -o AddressFamily=inet \
            "$ORACLE_USER@$ORACLE_HOST" \
            > /tmp/ssh-config.txt

          echo "SSH_CONFIGURATION_VALID"

          echo
          echo "Resolved SSH configuration:"

          grep -E \
            '^(hostname|user|port|identityfile|identitiesonly|preferredauthentications|pubkeyauthentication|addressfamily|connecttimeout)' \
            /tmp/ssh-config.txt \
            || true


      # =====================================================
      # SSH TCP + BANNER DIAGNOSTIC
      # =====================================================

      - name: Diagnose SSH Handshake
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}

        run: |
          set +e

          echo "========================================"
          echo "SSH HANDSHAKE DIAGNOSTIC"
          echo "========================================"

          echo
          echo "Running verbose SSH connection..."

          timeout 45 ssh \
            -vvv \
            -4 \
            -i ~/.ssh/oracle.key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=30 \
            -o ConnectionAttempts=1 \
            -o ServerAliveInterval=5 \
            -o ServerAliveCountMax=2 \
            -o TCPKeepAlive=yes \
            -o GSSAPIAuthentication=no \
            -o PreferredAuthentications=publickey \
            -o PubkeyAuthentication=yes \
            -o IdentitiesOnly=yes \
            -o AddressFamily=inet \
            "$ORACLE_USER@$ORACLE_HOST" \
            "echo ORACLE_SSH_OK"

          SSH_RESULT=$?

          echo
          echo "========================================"
          echo "SSH EXIT CODE: $SSH_RESULT"
          echo "========================================"

          if [ "$SSH_RESULT" -eq 0 ]; then
            echo "ORACLE_SSH_OK"
          else
            echo "ORACLE_SSH_FAILED"
          fi

          exit 0


      # =====================================================
      # SSH KEY AUTHENTICATION TEST
      # =====================================================

      - name: Test Public Key Authentication
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}

        run: |
          set +e

          echo "========================================"
          echo "PUBLIC KEY AUTHENTICATION TEST"
          echo "========================================"

          timeout 45 ssh \
            -vv \
            -4 \
            -i ~/.ssh/oracle.key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=30 \
            -o ConnectionAttempts=1 \
            -o PreferredAuthentications=publickey \
            -o PubkeyAuthentication=yes \
            -o IdentitiesOnly=yes \
            -o GSSAPIAuthentication=no \
            "$ORACLE_USER@$ORACLE_HOST" \
            "echo PUBLIC_KEY_AUTH_OK"

          RESULT=$?

          echo
          echo "PUBLIC_KEY_TEST_EXIT_CODE: $RESULT"

          exit 0


      # =====================================================
      # FINAL RESULT
      # =====================================================

      - name: Diagnostic Complete
        run: |
          echo
          echo "========================================"
          echo "SSH DIAGNOSTIC COMPLETE"
          echo "========================================"

          echo
          echo "No Oracle application files were changed."

          echo
          echo "Check the previous diagnostic steps"
          echo "for the exact SSH failure point."
