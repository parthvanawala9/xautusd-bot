<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Delta Pro AutoTrader | Professional Terminal</title>
  <style>
    :root {
      --bg-app: #050811;
      --bg-card: #0b1120;
      --border-color: #1e293b;
      --accent-gold: #f59e0b;
      --accent-green: #10b981;
      --accent-red: #ef4444;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-app);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 20px;
    }

    .terminal-container { max-width: 1600px; margin: 0 auto; }

    .terminal-header {
      background: linear-gradient(135deg, #0b1120 0%, #111827 100%);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      margin-bottom: 20px;
    }

    .header-title h1 {
      font-size: 24px;
      color: var(--accent-gold);
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .server-badge {
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: #38bdf8;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-family: monospace;
      font-weight: bold;
    }

    .management-panel {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 25px;
    }

    .management-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    .btn-gold {
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      font-size: 13px;
    }

    #accounts-container {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }
    @media (min-width: 900px) {
      #accounts-container { grid-template-columns: repeat(2, 1fr); }
    }

    .account-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }

    .btn-action {
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 15px;
      width: 100%;
    }
    .btn-start { background: var(--accent-green); color: white; }
    .btn-stop { background: var(--accent-red); color: white; }

    .segment-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 15px;
    }
    .segment-box {
      background: #030712;
      border: 1px solid var(--border-color);
      padding: 12px;
      border-radius: 10px;
      font-size: 12px;
    }
    .segment-box h4 {
      font-size: 11px;
      color: var(--accent-gold);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .segment-box p {
      margin-bottom: 4px;
      color: var(--text-muted);
    }
    .segment-box b {
      color: var(--text-main);
    }
    .profit { color: var(--accent-green); font-weight: bold; }
    .loss { color: var(--accent-red); font-weight: bold; }

    .history-section {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 20px;
      margin-top: 25px;
    }
    .history-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
      font-size: 12px;
    }
    .history-table th, .history-table td {
      border: 1px solid var(--border-color);
      padding: 8px 12px;
      text-align: left;
    }
    .history-table th {
      color: var(--accent-gold);
      background: #030712;
    }
  </style>
</head>
<body>
  <div class="terminal-container">
    
    <!-- HEADER -->
    <header class="terminal-header">
      <div class="header-title">
        <div style="font-size: 10px; color: var(--text-muted); letter-spacing: 2px; font-weight: 800; text-transform: uppercase;">Institutional Grade Terminal</div>
        <h1>Delta Pro AutoTrader</h1>
        <p id="last-update" style="font-size: 11px; color: var(--text-muted); margin-top: 4px;">Connected</p>
      </div>
      <div id="server-ip-display" class="server-badge">IP: Loading...</div>
    </header>

    <!-- ACCOUNTS GRID -->
    <main id="accounts-container">
      <div style="background:var(--bg-card); border:1px solid var(--border-color); border-radius:16px; padding:40px; text-align:center; color:var(--text-muted); grid-column: 1 / -1;">
        Loading terminal accounts...
      </div>
    </main>

    <!-- TRADE HISTORY -->
    <section class="history-section">
      <h3 style="font-size: 16px; color: var(--accent-gold); margin-bottom: 10px;">Trade History & Executions</h3>
      <div style="overflow-x: auto;">
        <table class="history-table">
          <thead>
            <tr>
              <th>Date/Time</th>
              <th>Symbol</th>
              <th>Direction</th>
              <th>Entry Price</th>
              <th>Exit Price</th>
              <th>Size</th>
              <th>Reason / Target</th>
            </tr>
          </thead>
          <tbody id="history-rows">
            <tr><td colspan="7" style="text-align:center; color:var(--text-muted);">No trades recorded yet.</td></tr>
          </tbody>
        </table>
      </div>
    </section>

  </div>

  <script>
    async function fetchDashboard() {
      try {
        const res = await fetch('/api/dashboard');
        const data = await res.json();
        if (data.success) {
          if (data.server_ip) {
            document.getElementById('server-ip-display').innerText = 'IP: ' + data.server_ip;
          }
          document.getElementById('last-update').innerText = 'Last update: ' + new Date().toLocaleTimeString();

          let html = '';
          if (data.bots && data.bots.length > 0) {
            data.bots.forEach(bot => {
              html += `
                <div class="account-card">
                  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                    <h3 style="font-size: 16px; font-weight: 700;">${bot.account_name}</h3>
                    <span style="font-size: 11px; font-family: monospace; background: #1e293b; padding: 4px 8px; border-radius: 6px; color: var(--accent-gold);">${bot.symbol}</span>
                  </div>
                  <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 8px;">
                    Status: <b>${bot.bot_enabled ? '🟢 ACTIVE' : '🔴 INACTIVE'}</b> | Balance: <b>$${Number(bot.balance || 0).toFixed(2)}</b> | LTP: <b>${bot.last_price || '-'}</b>
                  </p>
                  
                  <button class="btn-action ${bot.bot_enabled ? 'btn-stop' : 'btn-start'}" onclick="toggleBot('${bot.id}', ${bot.bot_enabled})">
                    ${bot.bot_enabled ? 'STOP BOT ⏹️' : 'START BOT ▶️'}
                  </button>

                  <div class="segment-grid">
                    <div class="segment-box">
                      <h4>Live Position</h4>
                      <p>Dir: <b>${bot.local_position || 'FLAT'}</b></p>
                      <p>Size: <b>${bot.size || 0}</b></p>
                      <p>Entry: <b>${bot.entry_price || '-'}</b></p>
                      <p>Stop Loss: <b style="color:var(--accent-red);">${bot.stop_loss || '-'}</b></p>
                      <p>Leverage: <b>${bot.leverage || 10}x</b></p>
                      <p>Margin: <b>$${Number(bot.margin || 0).toFixed(2)}</b></p>
                      <p>PnL: <span class="${(bot.unrealized_pnl || 0) >= 0 ? 'profit' : 'loss'}">$${Number(bot.unrealized_pnl || 0).toFixed(2)}</span></p>
                    </div>
                    <div class="segment-box">
                      <h4>Session & Targets</h4>
                      <p>Day High: <b style="color:var(--accent-green);">${bot.day_high || '-'}</b></p>
                      <p>Day Low: <b style="color:var(--accent-red);">${bot.day_low || '-'}</b></p>
                      <p>Active Target: <b>${bot.active_target || 'None'}</b></p>
                      <p>Trades: <b>${bot.stats.today.total_trades}</b></p>
                      <p>Today PnL: <span class="${bot.stats.today.pnl >= 0 ? 'profit' : 'loss'}">$${Number(bot.stats.today.pnl).toFixed(2)}</span></p>
                    </div>
                  </div>
                </div>
              `;
            });
          } else {
            html = `<div style="background:var(--bg-card); border:1px solid var(--border-color); border-radius:16px; padding:40px; text-align:center; color:var(--text-muted); grid-column: 1 / -1;">No active accounts or bots configured.</div>`;
          }
          document.getElementById('accounts-container').innerHTML = html;

          // History render
          if (data.trades && data.trades.length > 0) {
            let histHtml = '';
            data.trades.slice().reverse().forEach(t => {
              histHtml += `
                <tr>
                  <td>${t.date || '-'}</td>
                  <td>${t.symbol || 'XAUTUSD'}</td>
                  <td><b>${t.direction || '-'}</b></td>
                  <td>${t.entry_price || '-'}</td>
                  <td>${t.exit_price || '-'}</td>
                  <td>${t.size || '-'}</td>
                  <td><span style="color:var(--accent-gold);">${t.reason || '-'}</span></td>
                </tr>
              `;
            });
            document.getElementById('history-rows').innerHTML = histHtml;
          }
        }
      } catch (e) {
        console.error('Fetch error:', e);
      }
    }

    async function toggleBot(id, enabled) {
      const endpoint = enabled ? '/api/stop' : '/api/start';
      try {
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id })
        });
        const result = await res.json();
        alert(result.message || 'Done');
        fetchDashboard();
      } catch (err) {
        console.error('Error toggling bot:', err);
      }
    }

    setInterval(fetchDashboard, 3000);
    fetchDashboard();
  </script>
</body>
</html>
