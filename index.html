<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>XAUTUSD Delta Trading Dashboard</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>XAUTUSD Live Dashboard</h1>
      <span id="bot-status" class="status-offline">Connecting...</span>
    </header>

    <div class="grid">
      <div class="card">
        <h3>Current Price</h3>
        <p id="current-price">$0.00</p>
      </div>
      <div class="card">
        <h3>Wallet Balance</h3>
        <p id="wallet-balance">$0.00</p>
      </div>
      <div class="card">
        <h3>Total Trades</h3>
        <p id="total-trades">0</p>
      </div>
      <div class="card">
        <h3>Win Rate</h3>
        <p id="win-rate">0.0%</p>
      </div>
    </div>

    <div class="card position-card">
      <h2>Active Position</h2>
      <div class="pos-details">
        <p><strong>Direction:</strong> <span id="pos-direction">FLAT</span></p>
        <p><strong>Size:</strong> <span id="pos-size">0</span></p>
        <p><strong>Entry Price:</strong> <span id="pos-entry">$0.00</span></p>
        <p><strong>Stop Loss:</strong> <span id="pos-sl">$0.00</span></p>
        <p><strong>Unrealized PnL:</strong> <span id="pos-pnl">$0.00</span></p>
      </div>
    </div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
