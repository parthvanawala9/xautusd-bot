<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>XAUTUSD Professional Trading Terminal</title>
  <link rel="stylesheet" href="./style.css" />
  <style>
    :root {
      --bg-base: #07090e;
      --bg-card: #0d1322;
      --bg-card-hover: #111a2e;
      --border-color: #1e293b;
      --accent-gold: #f59e0b;
      --accent-green: #10b981;
      --accent-red: #ef4444;
      --text-main: #f8fafc;
      --text-muted: #64748b;
    }

    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 15px;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 1500px;
      margin: 0 auto;
    }

    /* Advanced Header */
    header.header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(135deg, #0d1322 0%, #111a2e 100%);
      padding: 24px;
      border-radius: 16px;
      border: 1px solid var(--border-color);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      margin-bottom: 20px;
    }

    .header-left .eyebrow {
      font-size: 11px;
      letter-spacing: 2px;
      color: var(--accent-gold);
      font-weight: 800;
      text-transform: uppercase;
    }

    .header-left h1 {
      font-size: 24px;
      margin: 6px 0 0 0;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    #last-update {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* Status Badge Glow Effect */
    .status {
      padding: 8px 16px;
      border-radius: 30px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.2);
    }
    .status.online {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.4);
      box-shadow: 0 0 15px rgba(16, 185, 129, 0.2);
    }

    /* Server IP Banner */
    .ip-banner {
      background: linear-gradient(90deg, #0d1322 0%, #111a2e 100%);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 18px 24px;
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .ip-title {
      font-size: 10px;
      color: var(--text-muted);
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }
    #server-ip-display {
      font-size: 16px;
      font-weight: 900;
      color: #38bdf8;
      font-family: monospace;
      letter-spacing: 0.5px;
    }

    /* Management Section */
    .management-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 25px;
    }
    .management-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }
    .add-client-button {
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      color: #fff;
      border: none;
      padding: 12px 20px;
      font-weight: 800;
      font-size: 12px;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
    }
    .add-client-button:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(245, 158, 11, 0.4);
    }

    /* Client Form Grid */
    .client-form {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid var(--border-color);
    }
    .form-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 15px;
    }
    @media (min-width: 640px) { .form-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (min-width: 1024px) { .form-grid { grid-template-columns: repeat(3, 1fr); } }

    .form-field label {
      display: block;
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 6px;
      font-weight: 700;
      text-transform: uppercase;
    }
    .form-field input {
      width: 100%;
      background: #030712;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 12px;
      color: #fff;
      font-size: 13px;
      box-sizing: border-box;
      transition: border-color 0.2s;
    }
    .form-field input:focus {
      outline: none;
      border-color: var(--accent-gold);
    }
    .success-button {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: white;
      border: none;
      padding: 14px;
      width: 100%;
      font-weight: 800;
      font-size: 13px;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
      transition: all 0.2s;
    }
    .success-button:hover { opacity: 0.95; transform: translateY(-1px); }

    /* Accounts Grid - PC 3 Columns, Mobile 1 Column */
    #accounts-container {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }
    @media (min-width: 768px) {
      #accounts-container { grid-template-columns: repeat(2, 1fr); }
    }
    @media (min-width: 1200px) {
      #accounts-container { grid-template-columns: repeat(3, 1fr); }
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="header-left">
        <div class="eyebrow">DELTA EXCHANGE TERMINAL</div>
        <h1>XAUTUSD AutoTrader</h1>
        <p id="last-update">Establishing secure connection...</p>
      </div>
      <div id="bot-status" class="status online">CONNECTING</div>
    </header>

    <!-- SERVER IP BANNER -->
    <section class="ip-banner">
      <div class="ip-title">Server Outbound IP (Whitelist in Delta API Settings)</div>
      <div id="server-ip-display">Detecting server IP...</div>
    </section>

    <!-- CLIENT MANAGEMENT -->
    <section class="management-card" id="admin-management-section">
      <div class="management-header">
        <div>
          <h2 style="margin:0; font-size: 18px; font-weight: 700;">Client Portal Control</h2>
          <p style="margin:4px 0 0 0; font-size: 12px; color: var(--text-muted);">Add new client credentials and generate isolated API tracking links.</p>
        </div>
        <button class="add-client-button" onclick="openClientForm()">+ ADD NEW CLIENT</button>
      </div>

      <div id="client-form" class="client-form" style="display:none;">
        <div class="form-grid">
          <div class="form-field"><label>Client Name</label><input id="client-name" type="text" placeholder="e.g. Rahul Sharma" /></div>
          <div class="form-field"><label>Delta API Key</label><input id="client-api-key" type="text" placeholder="Paste API Key" /></div>
          <div class="form-field"><label>Delta API Secret</label><input id="client-api-secret" type="password" placeholder="Paste API Secret" /></div>
          <div class="form-field"><label>Subscription Fee</label><input id="client-fee" type="number" placeholder="100" /></div>
          <div class="form-field"><label>Subscription Start</label><input id="client-start" type="datetime-local" /></div>
          <div class="form-field"><label>Subscription Expiry</label><input id="client-expiry" type="datetime-local" /></div>
        </div>
        <div style="margin-top: 20px;">
          <button class="success-button" onclick="addClient()">SAVE & GENERATE SECURE CLIENT LINK</button>
        </div>
      </div>
    </section>

    <!-- ACCOUNTS LIST CONTAINER -->
    <main id="accounts-container">
      <div style="background:var(--bg-card); border:1px solid var(--border-color); border-radius:16px; padding:40px; text-align:center; color:var(--text-muted); grid-column: 1 / -1;">
        Loading live accounts data...
      </div>
    </main>
  </div>

  <script>
    function openClientForm() {
      const form = document.getElementById('client-form');
      form.style.display = form.style.display === 'none' ? 'block' : 'none';
    }
  </script>
  <script src="./app.js"></script>
</body>
</html>
