<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Delta Pro AutoTrader | Professional Terminal</title>
  <style>
    :root {
      --bg-app: #050811;
      --bg-card: #0b1120;
      --border-color: #1e293b;
      --accent-gold: #f59e0b;
      --accent-green: #10b981;
      --accent-red: #ef4444;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-app);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 20px;
    }

    .terminal-container { max-width: 1600px; margin: 0 auto; }

    .terminal-header {
      background: linear-gradient(135deg, #0b1120 0%, #111827 100%);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      margin-bottom: 20px;
    }

    .header-title h1 {
      font-size: 24px;
      color: var(--accent-gold);
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .server-badge {
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: #38bdf8;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-family: monospace;
      font-weight: bold;
    }

    .management-panel {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 25px;
    }

    .management-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    .btn-gold {
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      font-size: 13px;
      transition: 0.2s;
    }
    .btn-gold:hover { opacity: 0.95; }

    .client-form-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 15px;
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid var(--border-color);
    }
    @media (min-width: 768px) {
      .client-form-grid { grid-template-columns: repeat(3, 1fr); }
    }

    .input-group label {
      display: block;
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 6px;
      font-weight: 700;
      text-transform: uppercase;
    }
    .input-group input {
      width: 100%;
      background: #030712;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 12px;
      color: white;
      font-size: 13px;
    }
    .input-group input:focus { outline: none; border-color: var(--accent-gold); }

    .btn-green {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: white;
      border: none;
      padding: 14px;
      width: 100%;
      border-radius: 10px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 15px;
    }

    #accounts-container {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }
    @media (min-width: 900px) {
      #accounts-container { grid-template-columns: repeat(2, 1fr); }
    }
    @media (min-width: 1350px) {
      #accounts-container { grid-template-columns: repeat(3, 1fr); }
    }

    .account-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }

    .btn-action {
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 15px;
      width: 100%;
    }
    .btn-start { background: var(--accent-green); color: white; }
    .btn-stop { background: var(--accent-red); color: white; }

    .segment-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 15px;
    }
    .segment-box {
      background: #030712;
      border: 1px solid var(--border-color);
      padding: 12px;
      border-radius: 10px;
      font-size: 12px;
    }
    .segment-box h4 {
      font-size: 11px;
      color: var(--accent-gold);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .profit { color: var(--accent-green); font-weight: bold; }
    .loss { color: var(--accent-red); font-weight: bold; }
  </style>
</head>
<body>
  <div class="terminal-container">
    
    <!-- HEADER -->
    <header class="terminal-header">
      <div class="header-title">
        <div style="font-size: 10px; color: var(--text-muted); letter-spacing: 2px; font-weight: 800; text-transform: uppercase;">Institutional Grade Terminal</div>
        <h1>Delta Pro AutoTrader</h1>
        <p id="last-update" style="font-size: 11px; color: var(--text-muted); margin-top: 4px;">Connected</p>
      </div>
      <div id="server-ip-display" class="server-badge">IP: Loading...</div>
    </header>

    <!-- ADMIN MANAGEMENT -->
    <section class="management-panel">
      <div class="management-top">
        <div>
          <h2 style="font-size: 18px; font-weight: 700;">Client Management Portal</h2>
          <p style="font-size: 12px; color: var(--text-muted); margin-top: 2px;">Deploy and manage isolated API trading instances.</p>
        </div>
        <button class="btn-gold" onclick="toggleClientForm()">+ ADD NEW CLIENT</button>
      </div>

      <div id="client-form" style="display:none;">
        <div class="client-form-grid">
          <div class="input-group"><label>Client Name</label><input id="client-name" type="text" placeholder="e.g. Rahul" /></div>
          <div class="input-group"><label>Delta API Key</label><input id="client-api-key" type="text" placeholder="API Key" /></div>
          <div class="input-group"><label>Delta API Secret</label><input id="client-api-secret" type="password" placeholder="API Secret" /></div>
        </div>
        <button class="btn-green" onclick="addClient()">SAVE & ADD CLIENT</button>
      </div>
    </section>

    <!-- ACCOUNTS GRID -->
    <main id="accounts-container">
      <div style="background:var(--bg-card); border:1px solid var(--border-color); border-radius:16px; padding:40px; text-align:center; color:var(--text-muted); grid-column: 1 / -1;">
        Loading terminal accounts...
      </div>
    </main>

  </div>

  <script>
    function toggleClientForm() {
      const f = document.getElementById('client-form');
      f.style.display = f.style.display === 'none' ? 'block' : 'none';
    }

    async function fetchDashboard() {
      try {
        const res = await fetch('/api/dashboard');
        const data = await res.json();
        if (data.success) {
          if (data.server_ip) {
            document.getElementById('server-ip-display').innerText = 'IP: ' + data.server_ip;
          }
          document.getElementById('last-update').innerText = 'Last update: ' + new Date().toLocaleTimeString();

          let html = '';
          if (data.bots && data.bots.length > 0) {
            data.bots.forEach(bot => {
              html += `
                <div class="account-card">
                  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                    <h3 style="font-size: 16px; font-weight: 700;">${bot.account_name}</h3>
                    <span style="font-size: 11px; font-family: monospace; background: #1e293b; padding: 4px 8px; border-radius: 6px; color: var(--accent-gold);">${bot.symbol}</span>
                  </div>
                  <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 8px;">
                    Status: <b>${bot.bot_enabled ? '🟢 ACTIVE' : '🔴 INACTIVE'}</b> | LTP: <b>${bot.last_price || '-'}</b>
                  </p>
                  
                  <button class="btn-action ${bot.bot_enabled ? 'btn-stop' : 'btn-start'}" onclick="toggleBot('${bot.id}', ${bot.bot_enabled})">
                    ${bot.bot_enabled ? 'STOP BOT ⏹️' : 'START BOT ▶️'}
                  </button>

                  <div class="segment-grid">
                    <div class="segment-box">
                      <h4>Live Position</h4>
                      <p>Dir: <b>${bot.local_position || 'FLAT'}</b></p>
                      <p>Size: <b>${bot.size}</b></p>
                      <p>Entry: <b>${bot.entry_price || '-'}</b></p>
                      <p>PnL: <span class="${bot.unrealized_pnl >= 0 ? 'profit' : 'loss'}">$${Number(bot.unrealized_pnl).toFixed(2)}</span></p>
                    </div>
                    <div class="segment-box">
                      <h4>Performance</h4>
                      <p>Trades: <b>${bot.stats.today.total_trades}</b></p>
                      <p>Win Rate: <b>${bot.stats.today.win_rate.toFixed(1)}%</b></p>
                      <p>Today: <span class="${bot.stats.today.pnl >= 0 ? 'profit' : 'loss'}">$${Number(bot.stats.today.pnl).toFixed(2)}</span></p>
                      <p>All-Time: <span class="${bot.stats.all_time.pnl >= 0 ? 'profit' : 'loss'}">$${Number(bot.stats.all_time.pnl).toFixed(2)}</span></p>
                    </div>
                  </div>
                </div>
              `;
            });
          } else {
            html = `<div style="background:var(--bg-card); border:1px solid var(--border-color); border-radius:16px; padding:40px; text-align:center; color:var(--text-muted); grid-column: 1 / -1;">No active accounts or bots configured. Check API keys.</div>`;
          }
          document.getElementById('accounts-container').innerHTML = html;
        }
      } catch (e) {
        console.error('Fetch error:', e);
      }
    }

    async function toggleBot(id, enabled) {
      const endpoint = enabled ? '/api/stop' : '/api/start';
      try {
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id })
        });
        const result = await res.json();
        alert(result.message || 'Done');
        fetchDashboard();
      } catch (err) {
        console.error('Error toggling bot:', err);
      }
    }

    async function addClient() {
      const name = document.getElementById('client-name').value;
      const api_key = document.getElementById('client-api-key').value;
      const api_secret = document.getElementById('client-api-secret').value;
      if (!api_key || !api_secret) {
        alert('API Key and Secret are required.');
        return;
      }
      try {
        const res = await fetch('/api/client/add', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, api_key, api_secret })
        });
        const result = await res.json();
        alert(result.message);
        if (result.success) {
          document.getElementById('client-form').style.display = 'none';
          fetchDashboard();
        }
      } catch (err) {
        console.error('Error adding client:', err);
      }
    }

    setInterval(fetchDashboard, 3000);
    fetchDashboard();
  </script>
</body>
</html>
