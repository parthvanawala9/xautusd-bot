<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>XAUTUSD Trading Dashboard</title>
  <link rel="stylesheet" href="./style.css" />
  <style>
    /* Professional Layout & Responsive Enhancements */
    body {
      background-color: #090d16;
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 10px;
    }
    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 15px;
    }
    header.header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #111827;
      padding: 20px;
      border-radius: 12px;
      border: 1px solid #1f2937;
      margin-bottom: 20px;
    }
    header.header h1 {
      font-size: 22px;
      margin: 5px 0 0 0;
      color: #fbbf24;
    }
    .eyebrow {
      font-size: 10px;
      letter-spacing: 1.5px;
      color: #94a3b8;
      font-weight: 700;
    }
    /* PC & Mobile Grid System for Accounts Container */
    #accounts-container {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }
    @media (min-width: 768px) {
      #accounts-container {
        grid-template-columns: repeat(2, 1fr); /* Tablet & Small Laptops: 2 Columns */
      }
    }
    @media (min-width: 1100px) {
      #accounts-container {
        grid-template-columns: repeat(3, 1fr); /* Desktop/PC: 3 Columns Professional Terminal View */
      }
    }
    .card {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    .management-card {
      margin-bottom: 20px;
    }
    .management-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    .add-client-button {
      background: #d97706;
      color: white;
      border: none;
      padding: 10px 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
    }
    .add-client-button:hover { background: #b45309; }
    .form-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin-top: 15px;
    }
    @media (min-width: 640px) {
      .form-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
    @media (min-width: 1024px) {
      .form-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }
    .form-field label {
      display: block;
      font-size: 11px;
      color: #94a3b8;
      margin-bottom: 5px;
      font-weight: 600;
    }
    .form-field input {
      width: 100%;
      background: #030712;
      border: 1px solid #374151;
      border-radius: 8px;
      padding: 10px;
      color: #fff;
      font-size: 13px;
      box-sizing: border-box;
    }
    .success-button {
      background: #059669;
      color: white;
      border: none;
      padding: 12px;
      width: 100%;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
    }
    .success-button:hover { background: #047857; }
    .status {
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: bold;
    }
    .status.online {
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <div>
        <div class="eyebrow">DELTA EXCHANGE</div>
        <h1>XAUTUSD Trading Dashboard</h1>
        <p id="last-update" style="font-size: 12px; color: #94a3b8; margin: 4px 0 0 0;">Connecting...</p>
      </div>
      <div id="bot-status" class="status online">CONNECTING</div>
    </header>

    <!-- SERVER IP BANNER -->
    <section class="card" style="background:#0f172a; color:#fff; padding:15px; margin-bottom:20px;">
      <div style="font-size:11px; color:#94a3b8; font-weight:800; text-transform:uppercase; letter-spacing:1px;">Server Outbound IP (Whitelist in Delta API)</div>
      <div id="server-ip-display" style="font-size:18px; font-weight:900; color:#4ade80; margin-top:5px;">Loading IP...</div>
    </section>

    <!-- CLIENT MANAGEMENT -->
    <section class="card management-card" id="admin-management-section">
      <div class="management-header">
        <div>
          <h2 style="margin:0; font-size: 18px;">Client Accounts</h2>
          <p style="margin:4px 0 0 0; font-size: 12px; color: #94a3b8;">Add a client's Delta account and get their secret portal link.</p>
        </div>
        <button class="add-client-button" onclick="openClientForm()">+ ADD CLIENT</button>
      </div>

      <div id="client-form" class="client-form" style="display:none;">
        <div class="form-grid">
          <div class="form-field"><label>Client Name</label><input id="client-name" type="text" placeholder="Rahul" /></div>
          <div class="form-field"><label>Delta API Key</label><input id="client-api-key" type="text" placeholder="API Key" /></div>
          <div class="form-field"><label>Delta API Secret</label><input id="client-api-secret" type="password" placeholder="API Secret" /></div>
          <div class="form-field"><label>Subscription Fee</label><input id="client-fee" type="number" placeholder="100" /></div>
          <div class="form-field"><label>Subscription Start</label><input id="client-start" type="datetime-local" /></div>
          <div class="form-field"><label>Subscription Expiry</label><input id="client-expiry" type="datetime-local" /></div>
        </div>
        <div class="form-actions" style="margin-top:15px;">
          <button class="success-button" onclick="addClient()">SAVE & GENERATE CLIENT LINK</button>
        </div>
      </div>
    </section>

    <!-- ACCOUNTS LIST CONTAINER (Responsive Grid) -->
    <main id="accounts-container">
      <section class="card loading-card" style="text-align: center; color: #94a3b8; padding: 40px;">Loading accounts...</section>
    </main>
  </div>

  <script>
    function openClientForm() {
      const form = document.getElementById('client-form');
      form.style.display = form.style.display === 'none' ? 'block' : 'none';
    }
  </script>
  <script src="./app.js"></script>
</body>
</html>
