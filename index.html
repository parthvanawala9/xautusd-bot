<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Delta Pro AutoTrader | Professional Terminal</title>

  <style>
    :root {
      --bg-app: #050811;
      --bg-card: #0b1120;
      --border-color: #1e293b;
      --accent-gold: #f59e0b;
      --accent-green: #10b981;
      --accent-red: #ef4444;
      --accent-blue: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-app);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 20px;
    }

    .terminal-container {
      max-width: 1600px;
      margin: 0 auto;
    }

    .terminal-header {
      background: linear-gradient(135deg, #0b1120 0%, #111827 100%);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      margin-bottom: 20px;
      gap: 15px;
    }

    .header-title h1 {
      font-size: 24px;
      color: var(--accent-gold);
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .server-badge {
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: var(--accent-blue);
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-family: monospace;
      font-weight: bold;
      white-space: nowrap;
    }

    .management-panel {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 25px;
    }

    #accounts-container {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }

    .account-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }

    .btn-action {
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 15px;
      width: 100%;
    }

    .btn-start {
      background: var(--accent-green);
      color: white;
    }

    .btn-stop {
      background: var(--accent-red);
      color: white;
    }

    .segment-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 15px;
    }

    .segment-box {
      background: #030712;
      border: 1px solid var(--border-color);
      padding: 12px;
      border-radius: 10px;
      font-size: 12px;
    }

    .segment-box h4 {
      font-size: 11px;
      color: var(--accent-gold);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .segment-box p {
      margin-bottom: 4px;
      color: var(--text-muted);
    }

    .segment-box b {
      color: var(--text-main);
    }

    .profit {
      color: var(--accent-green);
      font-weight: bold;
    }

    .loss {
      color: var(--accent-red);
      font-weight: bold;
    }

    /* ======================================================
       TEN TARGETS
       ====================================================== */

    .targets-section {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 20px;
      margin-top: 20px;
    }

    .targets-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }

    .targets-title {
      font-size: 16px;
      color: var(--accent-gold);
      font-weight: 800;
    }

    .target-summary {
      font-size: 12px;
      color: var(--text-muted);
    }

    .target-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 10px;
    }

    .target-card {
      background: #030712;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 12px;
      min-width: 0;
    }

    .target-card.pending {
      border-color: #334155;
    }

    .target-card.hit {
      border-color: var(--accent-green);
      box-shadow: 0 0 0 1px rgba(16,185,129,0.15);
    }

    .target-card.skipped {
      opacity: 0.55;
    }

    .target-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      margin-bottom: 10px;
    }

    .target-name {
      color: var(--accent-gold);
      font-weight: 900;
      font-size: 15px;
    }

    .target-status {
      font-size: 9px;
      font-weight: 900;
      padding: 3px 6px;
      border-radius: 5px;
      background: #1e293b;
      color: var(--text-muted);
    }

    .target-card.hit .target-status {
      background: rgba(16,185,129,0.15);
      color: var(--accent-green);
    }

    .target-price {
      font-size: 18px;
      font-weight: 900;
      color: var(--text-main);
      margin-bottom: 8px;
      word-break: break-all;
    }

    .target-row {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      font-size: 11px;
      margin-top: 5px;
      color: var(--text-muted);
    }

    .target-row strong {
      color: var(--text-main);
      text-align: right;
    }

    .active-target-banner {
      margin-top: 15px;
      padding: 12px;
      border: 1px solid rgba(245,158,11,0.35);
      background: rgba(245,158,11,0.08);
      border-radius: 10px;
      font-size: 12px;
    }

    .active-target-banner b {
      color: var(--accent-gold);
    }

    /* ======================================================
       CLIENTS
       ====================================================== */

    .clients-section {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 20px;
      margin-top: 25px;
    }

    .clients-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 15px;
    }

    .clients-title {
      font-size: 16px;
      color: var(--accent-gold);
      font-weight: 800;
    }

    .client-count {
      color: var(--text-muted);
      font-size: 12px;
    }

    .client-form {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr auto;
      gap: 10px;
      margin-bottom: 16px;
    }

    .client-input {
      width: 100%;
      background: #030712;
      color: var(--text-main);
      border: 1px solid var(--border-color);
      border-radius: 9px;
      padding: 11px 12px;
      outline: none;
      font-size: 12px;
    }

    .client-input:focus {
      border-color: var(--accent-gold);
    }

    .client-add-btn {
      border: none;
      border-radius: 9px;
      padding: 11px 16px;
      background: var(--accent-gold);
      color: #111827;
      font-weight: 900;
      cursor: pointer;
      white-space: nowrap;
    }

    .client-add-btn:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .clients-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .client-card {
      background: #030712;
      border: 1px solid var(--border-color);
      border-radius: 11px;
      padding: 13px;
    }

    .client-card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .client-name {
      font-weight: 900;
      color: var(--text-main);
    }

    .client-active {
      font-size: 9px;
      font-weight: 900;
      color: var(--accent-green);
      background: rgba(16,185,129,0.12);
      border-radius: 5px;
      padding: 3px 6px;
    }

    .client-meta {
      color: var(--text-muted);
      font-size: 11px;
      line-height: 1.6;
    }

    .client-meta b {
      color: var(--text-main);
    }

    /* ======================================================
       HISTORY
       ====================================================== */

    .history-section {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 20px;
      margin-top: 25px;
    }

    .history-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
      font-size: 12px;
    }

    .history-table th,
    .history-table td {
      border: 1px solid var(--border-color);
      padding: 8px 12px;
      text-align: left;
      white-space: nowrap;
    }

    .history-table th {
      color: var(--accent-gold);
      background: #030712;
    }

    @media (max-width: 1000px) {
      .client-form {
        grid-template-columns: 1fr 1fr;
      }

      .client-add-btn {
        width: 100%;
      }

      .clients-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }


      .target-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 700px) {
      body {
        padding: 10px;
      }

      .terminal-header {
        padding: 16px;
        align-items: flex-start;
        flex-direction: column;
      }

      .header-title h1 {
        font-size: 20px;
      }

      .segment-grid {
        grid-template-columns: 1fr;
      }

      .client-form {
        grid-template-columns: 1fr;
      }

      .clients-grid {
        grid-template-columns: 1fr;
      }

      .target-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 430px) {
      .target-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<div class="terminal-container">

  <!-- HEADER -->
  <header class="terminal-header">

    <div class="header-title">

      <div style="
        font-size:10px;
        color:var(--text-muted);
        letter-spacing:2px;
        font-weight:800;
        text-transform:uppercase;
      ">
        Institutional Grade Terminal
      </div>

      <h1>
        Delta Pro AutoTrader
      </h1>

      <p
        id="last-update"
        style="
          font-size:11px;
          color:var(--text-muted);
          margin-top:4px;
        "
      >
        Connecting...
      </p>

    </div>

    <div
      id="server-ip-display"
      class="server-badge"
    >
      IP: Loading...
    </div>

  </header>


  <!-- ACCOUNTS -->
  <main id="accounts-container">

    <div style="
      background:var(--bg-card);
      border:1px solid var(--border-color);
      border-radius:16px;
      padding:40px;
      text-align:center;
      color:var(--text-muted);
    ">
      Loading terminal accounts...
    </div>

  </main>


  <!-- CLIENTS -->
  <section class="clients-section">

    <div class="clients-header">

      <div class="clients-title">
        Clients / Accounts
      </div>

      <div id="client-count" class="client-count">
        0 clients
      </div>

    </div>

    <form id="client-form" class="client-form">

      <input
        id="client-name"
        class="client-input"
        type="text"
        placeholder="Client name *"
        autocomplete="off"
        required
      />

      <input
        id="client-id"
        class="client-input"
        type="text"
        placeholder="Client ID (optional)"
        autocomplete="off"
      />

      <input
        id="client-account-name"
        class="client-input"
        type="text"
        placeholder="Account name (optional)"
        autocomplete="off"
      />

      <button
        id="client-add-btn"
        class="client-add-btn"
        type="submit"
      >
        + ADD CLIENT
      </button>

    </form>

    <div id="clients-container" class="clients-grid">
      <div style="
        grid-column:1 / -1;
        padding:20px;
        text-align:center;
        color:var(--text-muted);
        background:#030712;
        border:1px solid var(--border-color);
        border-radius:10px;
      ">
        Loading clients...
      </div>
    </div>

  </section>


  <!-- HISTORY -->
  <section class="history-section">

    <h3 style="
      font-size:16px;
      color:var(--accent-gold);
      margin-bottom:10px;
    ">
      Trade History & Executions
    </h3>

    <div style="overflow-x:auto;">

      <table class="history-table">

        <thead>

          <tr>
            <th>Date/Time</th>
            <th>Symbol</th>
            <th>Direction</th>
            <th>Entry Price</th>
            <th>Exit Price</th>
            <th>Size</th>
            <th>Reason / Target</th>
            <th>PnL</th>
          </tr>

        </thead>

        <tbody id="history-rows">

          <tr>
            <td
              colspan="8"
              style="
                text-align:center;
                color:var(--text-muted);
              "
            >
              No trades recorded yet.
            </td>
          </tr>

        </tbody>

      </table>

    </div>

  </section>

</div>


<script>

  function money(value) {

    const n = Number(value || 0);

    return n.toFixed(2);
  }


  function price(value) {

    if (
      value === null ||
      value === undefined ||
      value === ""
    ) {
      return "-";
    }

    const n = Number(value);

    if (!Number.isFinite(n)) {
      return "-";
    }

    return n.toFixed(2);
  }


  function targetStatusClass(status) {

    if (status === "HIT") {
      return "hit";
    }

    if (status === "SKIPPED") {
      return "skipped";
    }

    return "pending";
  }


  function renderTargets(bot) {

    const targets =
      Array.isArray(bot.targets)
        ? bot.targets
        : [];

    if (!targets.length) {

      return `
        <section class="targets-section">

          <div class="targets-header">

            <div class="targets-title">
              10 TARGETS
            </div>

            <div class="target-summary">
              No active position
            </div>

          </div>

          <div style="
            padding:20px;
            text-align:center;
            color:var(--text-muted);
            background:#030712;
            border-radius:10px;
            border:1px solid var(--border-color);
          ">
            Targets will appear here after a LONG or SHORT entry.
          </div>

        </section>
      `;
    }


    let cards = "";


    targets.forEach((target) => {

      const status =
        target.status || "PENDING";

      const statusClass =
        targetStatusClass(status);

      const pnl =
        Number(target.expected_pnl || 0);


      cards += `

        <div class="target-card ${statusClass}">

          <div class="target-top">

            <div class="target-name">
              ${target.label || (target.number + "R")}
            </div>

            <div class="target-status">
              ${status}
            </div>

          </div>


          <div class="target-price">
            ${price(target.price)}
          </div>


          <div class="target-row">
            <span>Exit Qty</span>
            <strong>
              ${Number(target.quantity || 0)}
            </strong>
          </div>


          <div class="target-row">
            <span>Remaining</span>
            <strong>
              ${Number(target.remaining_after || 0)}
            </strong>
          </div>


          <div class="target-row">
            <span>Est. PnL</span>
            <strong class="${pnl >= 0 ? "profit" : "loss"}">
              $${money(pnl)}
            </strong>
          </div>

        </div>

      `;

    });


    let activeHtml = "";


    if (bot.active_target) {

      activeHtml = `

        <div class="active-target-banner">

          Active Target:

          <b>
            ${bot.active_target.label}
          </b>

          &nbsp; | &nbsp;

          Price:

          <b>
            ${price(bot.active_target.price)}
          </b>

          &nbsp; | &nbsp;

          Exit:

          <b>
            ${Number(bot.active_target.quantity || 0)}
          </b>

          contracts

        </div>

      `;

    }


    return `

      <section class="targets-section">

        <div class="targets-header">

          <div class="targets-title">
            10 TARGETS — 1R TO 10R
          </div>

          <div class="target-summary">

            ${Number(bot.targets_hit || 0)}
            / 10 targets completed

          </div>

        </div>


        <div class="target-grid">

          ${cards}

        </div>


        ${activeHtml}

      </section>

    `;
  }


  function renderBot(bot) {

    const direction =
      bot.local_position || "FLAT";

    const pnl =
      Number(bot.unrealized_pnl || 0);

    const todayPnl =
      Number(
        bot.today_pnl ??
        bot.stats?.today?.pnl ??
        0
      );


    return `

      <div class="account-card">

        <div style="
          display:flex;
          justify-content:space-between;
          align-items:center;
          margin-bottom:12px;
          gap:10px;
        ">

          <h3 style="
            font-size:16px;
            font-weight:700;
          ">
            ${bot.account_name || "Main"}
          </h3>

          <span style="
            font-size:11px;
            font-family:monospace;
            background:#1e293b;
            padding:4px 8px;
            border-radius:6px;
            color:var(--accent-gold);
          ">
            ${bot.symbol || "XAUTUSD"}
          </span>

        </div>


        <p style="
          font-size:12px;
          color:var(--text-muted);
          margin-bottom:8px;
        ">

          Status:

          <b>
            ${
              bot.bot_enabled
                ? "🟢 ACTIVE"
                : "🔴 INACTIVE"
            }
          </b>

          &nbsp; | &nbsp;

          Balance:

          <b>
            $${money(bot.balance)}
          </b>

          &nbsp; | &nbsp;

          LTP:

          <b>
            ${price(bot.last_price)}
          </b>

        </p>


        <button
          class="btn-action ${
            bot.bot_enabled
              ? "btn-stop"
              : "btn-start"
          }"
          onclick="
            toggleBot(
              '${bot.id}',
              ${bot.bot_enabled}
            )
          "
        >
          ${
            bot.bot_enabled
              ? "STOP BOT ⏹️"
              : "START BOT ▶️"
          }
        </button>


        <div class="segment-grid">

          <!-- LIVE POSITION -->

          <div class="segment-box">

            <h4>
              Live Position
            </h4>

            <p>
              Dir:
              <b>${direction}</b>
            </p>

            <p>
              Size:
              <b>${Number(bot.size || 0)}</b>
            </p>

            <p>
              Entry:
              <b>${price(bot.entry_price)}</b>
            </p>

            <p>
              Stop Loss:
              <b style="color:var(--accent-red);">
                ${price(bot.stop_loss)}
              </b>
            </p>

            <p>
              Leverage:
              <b>${Number(bot.leverage || 10)}x</b>
            </p>

            <p>
              Margin:
              <b>$${money(bot.margin)}</b>
            </p>

            <p>
              Liquidation:
              <b style="color:#f97316;">
                ${price(bot.liquidation_price)}
              </b>
            </p>

            <p>
              PnL:
              <span class="${pnl >= 0 ? "profit" : "loss"}">
                $${money(pnl)}
              </span>
            </p>

          </div>


          <!-- SESSION -->

          <div class="segment-box">

            <h4>
              Session & Strategy
            </h4>

            <p>
              Day High:
              <b style="color:var(--accent-green);">
                ${price(bot.day_high)}
              </b>
            </p>

            <p>
              Day Low:
              <b style="color:var(--accent-red);">
                ${price(bot.day_low)}
              </b>
            </p>

            <p>
              Active Target:
              <b>
                ${
                  bot.active_target
                    ? bot.active_target.label
                    : "None"
                }
              </b>
            </p>

            <p>
              Targets Hit:
              <b>
                ${Number(bot.targets_hit || 0)} / 10
              </b>
            </p>

            <p>
              Remaining:
              <b>
                ${Number(bot.remaining_size || 0)}
              </b>
            </p>

            <p>
              Original Size:
              <b>
                ${Number(bot.original_size || 0)}
              </b>
            </p>

            <p>
              Today PnL:
              <span class="${todayPnl >= 0 ? "profit" : "loss"}">
                $${money(todayPnl)}
              </span>
            </p>

            ${
              bot.execution_uncertain
                ? `
                  <p style="
                    color:#f97316;
                    font-weight:800;
                    margin-top:8px;
                  ">
                    ⚠️ EXCHANGE STATE NEEDS RECONCILIATION
                  </p>
                `
                : ""
            }

          </div>

        </div>


        ${renderTargets(bot)}

      </div>

    `;
  }


  function escapeHtml(value) {

    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }


  function renderClients(clients) {

    const list = Array.isArray(clients) ? clients : [];

    const countEl = document.getElementById("client-count");

    if (countEl) {
      countEl.innerText = `${list.length} client${list.length === 1 ? "" : "s"}`;
    }

    const container = document.getElementById("clients-container");

    if (!container) {
      return;
    }

    if (!list.length) {

      container.innerHTML = `
        <div style="
          grid-column:1 / -1;
          padding:20px;
          text-align:center;
          color:var(--text-muted);
          background:#030712;
          border:1px solid var(--border-color);
          border-radius:10px;
        ">
          No clients added yet.
        </div>
      `;

      return;
    }

    container.innerHTML = list.slice().reverse().map((client) => {

      const name = escapeHtml(client.name || client.account_name || "Unnamed");
      const clientId = escapeHtml(client.id || "-");
      const accountName = escapeHtml(client.account_name || client.name || "-");
      const createdAt = escapeHtml(client.created_at || "-");

      return `
        <div class="client-card">

          <div class="client-card-top">
            <div class="client-name">${name}</div>
            <div class="client-active">${client.active === false ? "INACTIVE" : "ACTIVE"}</div>
          </div>

          <div class="client-meta">
            Client ID: <b>${clientId}</b><br>
            Account: <b>${accountName}</b><br>
            Added: <b>${createdAt}</b>
          </div>

        </div>
      `;

    }).join("");
  }


  async function addClient(event) {

    event.preventDefault();

    const nameEl = document.getElementById("client-name");
    const idEl = document.getElementById("client-id");
    const accountEl = document.getElementById("client-account-name");
    const button = document.getElementById("client-add-btn");

    const name = nameEl.value.trim();
    const clientId = idEl.value.trim();
    const accountName = accountEl.value.trim();

    if (!name) {
      alert("Client name is required.");
      return;
    }

    button.disabled = true;
    button.innerText = "ADDING...";

    try {

      const res = await fetch("/api/client/add", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          name,
          client_id: clientId,
          account_name: accountName || name
        })
      });

      const result = await res.json();

      if (!result.success) {
        throw new Error(result.message || "Unable to add client.");
      }

      nameEl.value = "";
      idEl.value = "";
      accountEl.value = "";

      renderClients(result.clients || []);
      alert(result.message || "Client added successfully.");

    } catch (error) {

      console.error("Add client error:", error);
      alert(error.message || "Unable to add client.");

    } finally {

      button.disabled = false;
      button.innerText = "+ ADD CLIENT";

    }
  }


  async function fetchClients() {

    try {

      const res = await fetch("/api/clients", {
        cache: "no-store"
      });

      const data = await res.json();

      if (data.success) {
        renderClients(data.clients || []);
      }

    } catch (error) {
      console.error("Client fetch error:", error);
    }
  }


  async function fetchDashboard() {

    try {

      const res =
        await fetch(
          "/api/dashboard",
          {
            cache: "no-store"
          }
        );


      const data =
        await res.json();


      if (!data.success) {
        return;
      }


      if (data.server_ip) {

        document.getElementById(
          "server-ip-display"
        ).innerText =
          "IP: " + data.server_ip;

      }


      document.getElementById(
        "last-update"
      ).innerText =
        "Last update: "
        + new Date().toLocaleTimeString();


      const accounts =
        Array.isArray(data.bots)
          ? data.bots
          : [];


      let html = "";


      if (accounts.length > 0) {

        accounts.forEach(
          (bot) => {
            html += renderBot(bot);
          }
        );

      } else {

        html = `

          <div style="
            background:var(--bg-card);
            border:1px solid var(--border-color);
            border-radius:16px;
            padding:40px;
            text-align:center;
            color:var(--text-muted);
          ">

            No active accounts or bots configured.

          </div>

        `;

      }


      document.getElementById(
        "accounts-container"
      ).innerHTML = html;

      // ====================================================
      // CLIENTS
      // ====================================================

      renderClients(data.clients || []);


      // ====================================================
      // HISTORY
      // ====================================================

      if (
        Array.isArray(data.trades)
        && data.trades.length > 0
      ) {

        let histHtml = "";


        data.trades
          .slice()
          .reverse()
          .forEach(
            (t) => {

              const tradePnl =
                Number(t.pnl || 0);


              histHtml += `

                <tr>

                  <td>
                    ${t.date || "-"}
                  </td>

                  <td>
                    ${t.symbol || "XAUTUSD"}
                  </td>

                  <td>
                    <b>
                      ${t.direction || "-"}
                    </b>
                  </td>

                  <td>
                    ${price(t.entry_price)}
                  </td>

                  <td>
                    ${price(t.exit_price)}
                  </td>

                  <td>
                    ${t.size || "-"}
                  </td>

                  <td>
                    <span style="
                      color:var(--accent-gold);
                    ">
                      ${t.reason || "-"}
                    </span>
                  </td>

                  <td class="${tradePnl >= 0 ? "profit" : "loss"}">
                    $${money(tradePnl)}
                  </td>

                </tr>

              `;

            }
          );


        document.getElementById(
          "history-rows"
        ).innerHTML = histHtml;

      }

    } catch (e) {

      console.error(
        "Fetch error:",
        e
      );

    }

  }


  async function toggleBot(
    id,
    enabled
  ) {

    const endpoint =
      enabled
        ? "/api/stop"
        : "/api/start";


    try {

      const res =
        await fetch(
          endpoint,
          {
            method: "POST",
            headers: {
              "Content-Type":
                "application/json"
            },
            body: JSON.stringify({
              id
            })
          }
        );


      const result =
        await res.json();


      alert(
        result.message
        || "Done"
      );


      fetchDashboard();

    } catch (err) {

      console.error(
        "Error toggling bot:",
        err
      );

      alert(
        "Dashboard request failed."
      );

    }

  }


  document.getElementById("client-form").addEventListener(
    "submit",
    addClient
  );


  setInterval(
    fetchDashboard,
    3000
  );


  fetchDashboard();
  fetchClients();

</script>

</body>
</html>
